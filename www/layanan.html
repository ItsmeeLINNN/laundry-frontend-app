<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spincycle Laundry - Master Layanan</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --dark-blue: #15428F;
            --light-blue: #9BB8EA;
            --text-main: #333333;
            --text-sub: #757575;
            --input-bg: #F5F5F5;
            --danger: #e74c3c;
            --success: #10B981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* Mencegah layar utama bergeser */
            background-color: #e0eafc; /* Warna background utama */
        }

        .mobile-screen {
            width: 100%;
            height: 100%;
            border-radius: 0; /* Menghilangkan sudut melengkung */
            border: none; /* Menghilangkan bingkai hitam */
            box-shadow: none; /* Menghilangkan bayangan */
            position: relative;
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, #ffffff 0%, #e6f0fa 100%); 
        }

        .header {
            padding: 25px 20px 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header i {
            font-size: 18px;
            color: var(--dark-blue);
            cursor: pointer;
        }

        .header h2 {
            font-size: 18px;
            color: var(--dark-blue);
            font-weight: bold;
        }

        .scrollable-content {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px 20px 20px;
            scrollbar-width: none;
        }

        .scrollable-content::-webkit-scrollbar {
            display: none;
        }

        .title-area {
            margin-bottom: 15px;
        }

        .title-area h1 {
            font-size: 24px;
            color: var(--dark-blue);
            margin-bottom: 4px;
        }

        .title-area p {
            font-size: 11px;
            color: var(--dark-blue);
            opacity: 0.8;
        }

        #admin-panel {
            display: none;
        }

        .form-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            margin-bottom: 25px;
            border-top: 4px solid var(--dark-blue);
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 10px;
            font-weight: bold;
            color: var(--text-sub);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .input-wrapper input,
        .input-wrapper select {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 12px;
            font-size: 13px;
            outline: none;
            transition: 0.3s;
        }

        .input-wrapper input:focus,
        .input-wrapper select:focus {
            border-color: var(--light-blue);
            background: white;
        }

        .error-text {
            display: none;
            color: var(--danger);
            font-size: 10px;
            margin-top: 5px;
        }

        .btn-save {
            width: 100%;
            background-color: var(--dark-blue);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }

        .btn-save:active {
            transform: scale(0.98);
        }

        .btn-save:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .section-title {
            font-size: 14px;
            font-weight: bold;
            color: var(--dark-blue);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .category-badge {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 10px;
            font-weight: bold;
        }

        .kiloan-badge {
            background: #e0e7ff;
            color: #4f46e5;
        }

        .satuan-badge {
            background: #fef3c7;
            color: #d97706;
        }

        .service-item {
            background: white;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .srv-details h4 {
            font-size: 13px;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .srv-details p {
            font-size: 12px;
            font-weight: bold;
            color: var(--dark-blue);
        }

        .btn-delete {
            background: none;
            border: none;
            color: var(--danger);
            font-size: 14px;
            cursor: pointer;
            padding: 5px;
        }

        .bottom-nav {
            background-color: white;
            height: 65px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #eee;
            z-index: 10;
        }

        .nav-item {
            text-align: center;
            color: #94a3b8;
            font-size: 9px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
        }

        .nav-item i {
            font-size: 18px;
        }

        .nav-item.active {
            color: var(--dark-blue);
            font-weight: bold;
        }

        .message {
            text-align: center;
            font-size: 12px;
            padding-top: 10px;
            color: #888;
        }

        .message.error {
            color: var(--danger);
        }
    </style>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/app-ui.js"></script>
    <script src="assets/js/access-guard.js"></script>
    <link rel="stylesheet" href="assets/css/mobile-fit.css">
</head>

<body>
    <div class="mobile-screen">
        <div class="header">
            <i class="fas fa-arrow-left" onclick="window.history.back()"></i>
            <h2>Layanan & Harga</h2>
            <div style="width:18px"></div>
        </div>

        <div class="scrollable-content">
            <div class="title-area">
                <h1>Daftar Layanan</h1>
                <p id="role-status">Memuat akses pengguna...</p>
            </div>

            <div id="admin-panel">
                <form class="form-card" id="formLayanan" novalidate>
                    <div class="form-group">
                        <label for="srv-name">Nama Layanan</label>
                        <div class="input-wrapper">
                            <input
                                type="text"
                                id="srv-name"
                                placeholder="Contoh: Cuci Karpet"
                                minlength="3"
                                maxlength="50"
                                pattern="[A-Za-zÀ-ÿ0-9 ]+"
                                title="Nama layanan hanya boleh huruf, angka, dan spasi"
                                required
                            >
                        </div>
                        <small class="error-text" id="name-error">
                            Nama layanan hanya boleh huruf, angka, dan spasi, minimal 3 karakter.
                        </small>
                    </div>

                    <div style="display: flex; gap: 10px;">
                        <div class="form-group" style="flex: 1;">
                            <label for="srv-category">Kategori</label>
                            <div class="input-wrapper">
                                <select id="srv-category" required>
                                    <option value="Kiloan">Kiloan</option>
                                    <option value="Satuan">Satuan</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group" style="flex: 1;">
                            <label for="srv-unit">Unit</label>
                            <div class="input-wrapper">
                                <input
                                    type="text"
                                    id="srv-unit"
                                    placeholder="Kg / Pcs / Meter"
                                    minlength="1"
                                    maxlength="15"
                                    pattern="[A-Za-zÀ-ÿ ]+"
                                    title="Unit hanya boleh huruf dan spasi"
                                    required
                                >
                            </div>
                            <small class="error-text" id="unit-error">
                                Unit hanya boleh huruf dan spasi.
                            </small>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="srv-price">Harga (Rp)</label>
                        <div class="input-wrapper">
                            <input
                                type="text"
                                id="srv-price"
                                placeholder="Contoh: 15000"
                                inputmode="numeric"
                                maxlength="9"
                                pattern="[0-9]+"
                                title="Harga hanya boleh angka"
                                required
                            >
                        </div>
                        <small class="error-text" id="price-error">
                            Harga hanya boleh angka dan harus lebih dari 0.
                        </small>
                    </div>

                    <button class="btn-save" id="btn-submit" type="submit">
                        Tambah Layanan
                    </button>
                </form>
            </div>

            <div class="section-title">Katalog Harga</div>
            <div id="service-list"></div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item" onclick="window.location.href='dashboard.html'">
                <i class="fas fa-home"></i>
                <span>BERANDA</span>
            </div>

            <div class="nav-item" onclick="window.location.href='list_order.html'">
                <i class="fas fa-file-alt"></i>
                <span>PESANAN</span>
            </div>

            <div class="nav-item" onclick="window.location.href='pelanggan_tambah.html'">
                <i class="fas fa-users"></i>
                <span>CUSTOMERS</span>
            </div>

            <div class="nav-item active" onclick="window.location.href='profile.html'">
                <i class="fas fa-user-circle"></i>
                <span>PROFILE</span>
            </div>
        </div>
    </div>

    <script>
        const apiUrl = `${window.LAUNDRY_API_BASE}/layanan`;

        const userRole = localStorage.getItem('user_role') || localStorage.getItem('role_kasir') || 'Karyawan';

        const formLayanan = document.getElementById('formLayanan');
        const serviceList = document.getElementById('service-list');

        const inputName = document.getElementById('srv-name');
        const inputCategory = document.getElementById('srv-category');
        const inputUnit = document.getElementById('srv-unit');
        const inputPrice = document.getElementById('srv-price');

        const btnSubmit = document.getElementById('btn-submit');

        const nameError = document.getElementById('name-error');
        const unitError = document.getElementById('unit-error');
        const priceError = document.getElementById('price-error');

        function onlyServiceName(value) {
            return value
                .replace(/[^A-Za-zÀ-ÿ0-9 ]/g, '')
                .replace(/\s+/g, ' ')
                .trimStart();
        }

        function onlyUnit(value) {
            return value
                .replace(/[^A-Za-zÀ-ÿ ]/g, '')
                .replace(/\s+/g, ' ')
                .trimStart();
        }

        function onlyNumber(value) {
            return value.replace(/[^0-9]/g, '');
        }

        inputName.addEventListener('input', function () {
            this.value = onlyServiceName(this.value);
        });

        inputUnit.addEventListener('input', function () {
            this.value = onlyUnit(this.value);
        });

        inputPrice.addEventListener('input', function () {
            this.value = onlyNumber(this.value);
        });

        function aturUI() {
            if (userRole === 'Admin') {
                document.getElementById('admin-panel').style.display = 'block';
                document.getElementById('role-status').textContent = 'Mode Admin: Anda dapat menambah/menghapus layanan.';
            } else if (userRole === 'Kasir') {
                document.getElementById('admin-panel').style.display = 'none';
                document.getElementById('role-status').textContent = 'Mode Kasir: Anda hanya dapat melihat daftar harga.';
            } else {
                document.getElementById('admin-panel').style.display = 'none';
                document.getElementById('role-status').textContent = 'Mode Karyawan: Anda hanya dapat melihat daftar harga.';
            }
        }

        function validasiLayanan() {
            const serviceName = inputName.value.trim();
            const unit = inputUnit.value.trim();
            const price = inputPrice.value.trim();

            const validName = /^[A-Za-zÀ-ÿ0-9 ]{3,50}$/.test(serviceName);
            const validUnit = /^[A-Za-zÀ-ÿ ]{1,15}$/.test(unit);
            const validPrice = /^[0-9]+$/.test(price) && Number(price) > 0;

            nameError.style.display = validName ? 'none' : 'block';
            unitError.style.display = validUnit ? 'none' : 'block';
            priceError.style.display = validPrice ? 'none' : 'block';

            return validName && validUnit && validPrice;
        }

        function setLoading(status) {
            btnSubmit.disabled = status;

            if (status) {
                btnSubmit.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';
            } else {
                btnSubmit.innerHTML = 'Tambah Layanan';
            }
        }

        async function muatDaftarLayanan() {
            try {
                serviceList.innerHTML = '<p class="message">Memuat katalog layanan...</p>';

                const response = await fetch(apiUrl, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.pesan || result.message || 'Gagal mengambil data layanan.');
                }

                const data = Array.isArray(result.data)
                    ? result.data
                    : Array.isArray(result)
                        ? result
                        : [];

                serviceList.innerHTML = '';

                if (data.length === 0) {
                    serviceList.innerHTML = '<p class="message">Belum ada katalog layanan.</p>';
                    return;
                }

                data.forEach(function (srv) {
                    serviceList.appendChild(buatItemLayanan(srv));
                });
            } catch (error) {
                console.error(error);
                serviceList.innerHTML = '<p class="message error">Gagal mengambil data dari server.</p>';
            }
        }

        function buatItemLayanan(srv) {
            const item = document.createElement('div');
            item.className = 'service-item';

            const details = document.createElement('div');
            details.className = 'srv-details';

            const badge = document.createElement('span');
            badge.className = 'category-badge ' + (srv.category === 'Kiloan' ? 'kiloan-badge' : 'satuan-badge');
            badge.textContent = srv.category || '-';

            const title = document.createElement('h4');
            title.style.marginTop = '6px';
            title.textContent = srv.service_name || '-';

            const price = document.createElement('p');
            price.textContent = `Rp ${new Intl.NumberFormat('id-ID').format(Number(srv.price) || 0)} / ${srv.unit || '-'}`;

            details.appendChild(badge);
            details.appendChild(title);
            details.appendChild(price);

            item.appendChild(details);

            if (userRole === 'Admin') {
                const deleteButton = document.createElement('button');
                deleteButton.className = 'btn-delete';
                deleteButton.type = 'button';
                deleteButton.innerHTML = '<i class="fas fa-trash"></i>';

                deleteButton.addEventListener('click', function () {
                    hapusLayanan(srv.id, srv.service_name || 'Layanan');
                });

                item.appendChild(deleteButton);
            }

            return item;
        }

        async function simpanLayanan() {
            if (userRole !== 'Admin') {
                alert('Akses ditolak. Hanya Admin yang dapat menambah layanan.');
                return;
            }

            inputName.value = onlyServiceName(inputName.value);
            inputUnit.value = onlyUnit(inputUnit.value);
            inputPrice.value = onlyNumber(inputPrice.value);

            if (!validasiLayanan()) {
                alert('Periksa kembali input layanan.');
                return;
            }

            const payload = {
                service_name: inputName.value.trim(),
                category: inputCategory.value,
                price: Number(inputPrice.value.trim()),
                unit: inputUnit.value.trim()
            };

            try {
                setLoading(true);

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.pesan || result.message || 'Data layanan gagal disimpan.');
                }

                if (result.status === 'SUKSES' || result.success === true) {
                    alert(result.pesan || 'Layanan berhasil ditambahkan.');

                    formLayanan.reset();

                    await muatDaftarLayanan();
                } else {
                    alert(result.pesan || result.message || 'Data layanan gagal disimpan.');
                }
            } catch (error) {
                console.error(error);
                alert(error.message || 'Terjadi kesalahan saat menghubungi server.');
            } finally {
                setLoading(false);
            }
        }

        async function hapusLayanan(id, name) {
            if (userRole !== 'Admin') {
                alert('Akses ditolak. Hanya Admin yang dapat menghapus layanan.');
                return;
            }

            const konfirmasi = confirm(`Yakin ingin menghapus layanan "${name}" secara permanen?`);

            if (!konfirmasi) {
                return;
            }

            try {
                const response = await fetch(`${apiUrl}/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.pesan || result.message || 'Gagal menghapus layanan.');
                }

                if (result.status === 'SUKSES' || result.success === true) {
                    await muatDaftarLayanan();
                } else {
                    alert(result.pesan || result.message || 'Gagal menghapus layanan.');
                }
            } catch (error) {
                console.error(error);
                alert(error.message || 'Gagal menghapus data. Periksa koneksi server.');
            }
        }

        formLayanan.addEventListener('submit', function (event) {
            event.preventDefault();
            simpanLayanan();
        });

        window.addEventListener('load', function () {
            aturUI();
            muatDaftarLayanan();
        });
    </script>
</body>
</html>
