<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spincycle Laundry - Master Layanan</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* CSS Tema Gradasi Biru-Putih Spincycle */
        :root {
            --dark-blue: #15428F; --light-blue: #9BB8EA; --text-main: #333333;
            --text-sub: #757575; --input-bg: #F5F5F5; --danger: #e74c3c;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .mobile-screen { background: linear-gradient(180deg, #ffffff 0%, #e6f0fa 100%); width: 375px; height: 750px; border-radius: 30px; box-shadow: 0 15px 45px rgba(21, 66, 143, 0.15); border: 10px solid #333; position: relative; display: flex; flex-direction: column; overflow: hidden; }
        
        .header { padding: 25px 20px 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .header i { font-size: 18px; color: var(--dark-blue); cursor: pointer; }
        .header h2 { font-size: 18px; color: var(--dark-blue); font-weight: bold; }
        
        .scrollable-content { flex: 1; overflow-y: auto; padding: 0 20px 20px 20px; scrollbar-width: none; }
        .scrollable-content::-webkit-scrollbar { display: none; }
        
        .title-area { margin-bottom: 15px; }
        .title-area h1 { font-size: 24px; color: var(--dark-blue); margin-bottom: 4px; }
        .title-area p { font-size: 11px; color: var(--dark-blue); opacity: 0.8; }

        /* FORM INPUT (Default Disembunyikan, hanya Admin yang bisa lihat) */
        #admin-panel { display: none; } 
        .form-card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); margin-bottom: 25px; border-top: 4px solid var(--dark-blue); }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 10px; font-weight: bold; color: var(--text-sub); margin-bottom: 6px; text-transform: uppercase; }
        .input-wrapper input, .input-wrapper select { width: 100%; background-color: var(--input-bg); border: 1px solid #eee; border-radius: 10px; padding: 12px; font-size: 13px; outline: none; }
        .btn-save { width: 100%; background-color: var(--dark-blue); color: white; border: none; border-radius: 10px; padding: 12px; font-size: 13px; font-weight: bold; cursor: pointer; margin-top: 10px; }

        /* SERVICE LIST */
        .section-title { font-size: 14px; font-weight: bold; color: var(--dark-blue); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .category-badge { font-size: 10px; padding: 3px 8px; border-radius: 10px; font-weight: bold; }
        .kiloan-badge { background: #e0e7ff; color: #4f46e5; }
        .satuan-badge { background: #fef3c7; color: #d97706; }
        
        .service-item { background: white; padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .srv-details h4 { font-size: 13px; color: var(--text-main); margin-bottom: 4px; }
        .srv-details p { font-size: 12px; font-weight: bold; color: var(--dark-blue); }
        .btn-delete { background: none; border: none; color: var(--danger); font-size: 14px; cursor: pointer; padding: 5px; display: none; /* Default disembunyikan */ }

        .bottom-nav { background-color: white; height: 65px; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #eee; z-index: 10; }
        .nav-item { text-align: center; color: #94a3b8; font-size: 9px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; align-items: center; }
        .nav-item i { font-size: 18px; }
        .nav-item.active { color: var(--dark-blue); font-weight: bold; }
    </style>
</head>
<body>

    <div class="mobile-screen">
        <div class="header">
            <i class="fas fa-arrow-left" onclick="window.location.href='dashboard.html'"></i>
            <h2>Layanan & Harga</h2>
            <div style="width:18px"></div>
        </div>

        <div class="scrollable-content">
            <div class="title-area">
                <h1>Daftar Layanan</h1>
                <p id="role-status">Memuat akses pengguna...</p>
            </div>

            <div id="admin-panel">
                <div class="form-card">
                    <div class="form-group">
                        <label>Nama Layanan</label>
                        <div class="input-wrapper"><input type="text" id="srv-name" placeholder="Contoh: Cuci Karpet" pattern="[A-Za-z\s]+" title="Hanya huruf dan spasi yang diperbolehkan" required></div>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <div class="form-group" style="flex: 1;">
                            <label>Kategori</label>
                            <div class="input-wrapper">
                                <select id="srv-category">
                                    <option value="Kiloan">Kiloan</option>
                                    <option value="Satuan">Satuan</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label>Unit (Satuan)</label>
                            <div class="input-wrapper"><input type="text" id="srv-unit" placeholder="Kg / Pcs / Meter" pattern="[A-Za-z\s]+" title="Hanya huruf dan spasi yang diperbolehkan" required></div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Harga (Rp)</label>
                        <div class="input-wrapper"><input type="number" id="srv-price" placeholder="Contoh: 15000" min="0" required></div>
                    </div>
                    <button class="btn-save" id="btn-submit" onclick="simpanLayanan()">Tambah Layanan</button>
                </div>
            </div>

            <div class="section-title">Katalog Harga</div>
            <div id="service-list">
                </div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item" onclick="window.location.href='dashboard.html'"><i class="fas fa-home"></i><span>BERANDA</span></div>
            <div class="nav-item" onclick="window.location.href='list_order.html'"><i class="fas fa-file-alt"></i><span>PESANAN</span></div>
            <div class="nav-item" onclick="window.location.href='pelanggan_tambah.html'"><i class="fas fa-users"></i><span>CUSTOMERS</span></div>
            <div class="nav-item active" onclick="window.location.href='layanan.html'"><i class="fas fa-box"></i><span>LAYANAN</span></div>
        </div>
    </div>

    <script>
        const apiUrl = 'https://laundry-backend-api-production.up.railway.app/api/layanan_baru';
        
        // Cek Role dari Local Storage
        const roleKasir = localStorage.getItem('role_kasir') || 'Karyawan';

        // Atur UI berdasarkan Role
        function aturUI() {
            if (roleKasir === 'Admin') {
                document.getElementById('admin-panel').style.display = 'block';
                document.getElementById('role-status').innerHTML = 'Mode Admin: Anda dapat menambah/menghapus layanan.';
            } else {
                document.getElementById('role-status').innerHTML = 'Mode Karyawan: Anda hanya dapat melihat daftar harga.';
            }
        }

        // 1. READ: Ambil Data dari MySQL
        async function muatDaftarLayanan() {
            try {
                const response = await fetch(apiUrl);
                const result = await response.json();
                const container = document.getElementById('service-list');
                container.innerHTML = '';

                result.data.forEach(srv => {
                    const formatRp = new Intl.NumberFormat('id-ID').format(srv.price);
                    const badgeClass = srv.category === 'Kiloan' ? 'kiloan-badge' : 'satuan-badge';
                    
                    // Tombol hapus hanya di-render untuk Admin
                    const deleteBtnHtml = roleKasir === 'Admin' 
                        ? `<button class="btn-delete" style="display:block;" onclick="hapusLayanan('${srv.id}', '${srv.service_name}')"><i class="fas fa-trash"></i></button>`
                        : '';

                    container.innerHTML += `
                        <div class="service-item">
                            <div class="srv-details">
                                <span class="category-badge ${badgeClass}">${srv.category}</span>
                                <h4 style="margin-top: 6px;">${srv.service_name}</h4>
                                <p>Rp ${formatRp} <span style="font-size:10px; color:#888; font-weight:normal;">/ ${srv.unit}</span></p>
                            </div>
                            ${deleteBtnHtml}
                        </div>
                    `;
                });
            } catch (error) {
                document.getElementById('service-list').innerHTML = '<p style="color:red; text-align:center; font-size:11px;">Gagal mengambil data dari server.</p>';
            }
        }

        // 2. CREATE: Tambah Layanan
        async function simpanLayanan() {
            const service_name = document.getElementById('srv-name').value;
            const category = document.getElementById('srv-category').value;
            const unit = document.getElementById('srv-unit').value;
            const price = document.getElementById('srv-price').value;

            if(!service_name || !unit || !price) {
                alert('Nama, Unit, dan Harga wajib diisi!'); return;
            }

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ service_name, category, price, unit })
                });

                const result = await response.json();
                if (result.status === 'SUKSES') {
                    alert(result.pesan);
                    // Kosongkan form
                    document.getElementById('srv-name').value = '';
                    document.getElementById('srv-price').value = '';
                    muatDaftarLayanan();
                } else { alert(result.pesan); }
            } catch (error) { alert('Terjadi kesalahan sistem!'); }
        }

        // 3. DELETE: Hapus Layanan
        async function hapusLayanan(id, name) {
            if(confirm(`Yakin ingin menghapus layanan "${name}"?`)) {
                try {
                    const response = await fetch(`${apiUrl}/${id}`, { method: 'DELETE' });
                    const result = await response.json();
                    if (result.status === 'SUKSES') { muatDaftarLayanan(); } 
                    else { alert(result.pesan); }
                } catch (error) { alert('Gagal menghapus data.'); }
            }
        }

        // Inisialisasi awal
        window.onload = () => {
            aturUI();
            muatDaftarLayanan();
        };
    </script>
</body>
</html>
