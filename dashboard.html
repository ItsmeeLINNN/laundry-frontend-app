<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spincycle - Beranda</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root { 
            --dark-blue: #15428F;
            --light-blue: #9BB8EA;
            --bg-main: #f4f8ff;
            --text-main: #1f2d3d;
            --text-sub: #8a97a8;
            --success: #10B981;
            --warning: #f59e0b;
            --danger: #e53e3e;
            --card-shadow: 0 6px 18px rgba(21, 66, 143, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .mobile-screen {
            background: var(--bg-main);
            width: 375px;
            height: 750px;
            border-radius: 30px;
            box-shadow: 0 15px 45px rgba(21, 66, 143, 0.15);
            border: 8px solid #333;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: transparent;
            padding: 24px 22px 8px 22px;
            border-radius: 0;
            box-shadow: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 5;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--light-blue), var(--dark-blue));
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            font-size: 16px;
            border: 2px solid white;
            box-shadow: 0 4px 10px rgba(21, 66, 143, 0.22);
        }

        .greet p {
            font-size: 10px;
            color: var(--text-sub);
            text-transform: uppercase;
            margin-bottom: 2px;
            font-weight: 500;
        }

        .greet h2 {
            font-size: 15px;
            color: var(--dark-blue);
            font-weight: 800;
        }

        .btn-notif {
            background: white;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            color: var(--dark-blue);
            font-size: 16px;
            cursor: pointer;
            position: relative;
            box-shadow: 0 4px 12px rgba(21, 66, 143, 0.08);
        }

        .notif-dot {
            position: absolute;
            top: 8px;
            right: 10px;
            width: 8px;
            height: 8px;
            background: var(--danger);
            border-radius: 50%;
        }

        /* Content */
        .scrollable-content {
            flex: 1;
            overflow-y: auto;
            padding: 8px 22px 85px 22px;
            scrollbar-width: none;
        }

        .scrollable-content::-webkit-scrollbar {
            display: none;
        }

        /* Revenue Card */
        .revenue-card {
            background: linear-gradient(135deg, var(--dark-blue) 0%, #2a5eb5 100%);
            border-radius: 18px;
            padding: 24px 20px;
            color: white;
            margin-bottom: 24px;
            box-shadow: 0 8px 20px rgba(21, 66, 143, 0.18);
        }

        .rev-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 11px;
            opacity: 0.85;
            font-weight: 600;
        }

        .revenue-card h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        /* Quick Actions */
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 26px;
        }

        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            cursor: pointer;
        }

        .action-icon {
            width: 50px;
            height: 50px;
            border-radius: 15px;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            box-shadow: var(--card-shadow);
        }

        .action-btn span {
            font-size: 10px;
            color: var(--text-main);
            font-weight: 600;
            text-align: center;
        }

        /* Section */
        .section-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .section-title {
            font-size: 17px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.3px;
        }

        /* Statistik */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 26px;
        }

        .stat-card {
            background: white;
            border-radius: 16px;
            padding: 15px;
            box-shadow: var(--card-shadow);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .stat-card.full {
            grid-column: span 2;
        }

        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 13px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .stat-info h3 {
            font-size: 20px;
            font-weight: 800;
            color: var(--dark-blue);
            line-height: 1;
        }

        .stat-info p {
            font-size: 10px;
            color: var(--text-sub);
            font-weight: 700;
            text-transform: uppercase;
            margin-top: 4px;
        }

        /* Pesanan Terbaru */
        .recent-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .recent-item {
            background: white;
            padding: 12px 14px;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .recent-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .recent-icon {
            width: 35px;
            height: 35px;
            background: #f0f4f8;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-sub);
        }

        .recent-info h4 {
            font-size: 13px;
            color: var(--text-main);
            font-weight: 700;
        }

        .recent-info p {
            font-size: 10px;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .recent-right {
            text-align: right;
        }

        .recent-price {
            font-size: 12px;
            font-weight: 800;
            color: var(--dark-blue);
        }

        .recent-status {
            font-size: 9px;
            font-weight: 800;
            margin-top: 3px;
            text-transform: uppercase;
        }

        .empty-state {
            text-align: center;
            padding: 20px 10px;
            color: var(--text-main);
            font-size: 14px;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 65px;
            background-color: white;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #eef1f5;
            z-index: 10;
        }

        .nav-item {
            width: 25%;
            text-align: center;
            color: #a7b1c2;
            font-size: 9px;
            font-weight: 700;
            cursor: pointer;
            line-height: 1.3;
        }

        .nav-item i {
            font-size: 18px;
            margin-bottom: 4px;
            display: inline-block;
        }

        .nav-item span {
            display: block;
        }

        .nav-item.active {
            color: var(--dark-blue);
            font-weight: 800;
        }
    </style>
</head>
<body>
    <div class="mobile-screen">
        <div class="header">
            <div class="user-info">
                <div class="avatar" id="user-initial">A</div>
                <div class="greet">
                    <p>Halo, Selamat Bekerja!</p>
                    <h2 id="greet-name">Memuat...</h2>
                </div>
            </div>
            <button class="btn-notif"><i class="fas fa-bell"></i><div class="notif-dot"></div></button>
        </div>

        <div class="scrollable-content">
            <div class="revenue-card">
                <div class="rev-header"><span>OMSET HARI INI</span><span>IDR</span></div>
                <h1 id="dash-pendapatan">Rp 0</h1>
            </div>

            <div class="quick-actions">
                <a href="transaksi_baru.html" class="action-btn"><div class="action-icon" style="color:#15428F"><i class="fas fa-plus"></i></div><span>Order Baru</span></a>
                <a href="pelanggan_tambah.html" class="action-btn"><div class="action-icon" style="color:#10B981"><i class="fas fa-user-plus"></i></div><span>Pelanggan</span></a>
                <a href="layanan.html" class="action-btn"><div class="action-icon" style="color:#f59e0b"><i class="fas fa-tags"></i></div><span>Layanan</span></a>
                <a href="list_order.html" class="action-btn"><div class="action-icon" style="color:#805ad5"><i class="fas fa-search-dollar"></i></div><span>Cek Nota</span></a>
            </div>

            <div class="section-header"><h3 class="section-title">Ringkasan Operasional</h3></div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon" style="background:#fef3c7; color:#f59e0b"><i class="fas fa-clock"></i></div>
                    <div class="stat-info"><h3 id="dash-proses">0</h3><p>Diproses</p></div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background:#d1fae5; color:#10B981"><i class="fas fa-check-double"></i></div>
                    <div class="stat-info"><h3 id="dash-selesai">0</h3><p>Selesai</p></div>
                </div>
                <div class="stat-card full">
                    <div class="stat-icon" style="background:#e0eafc; color:#15428F"><i class="fas fa-users"></i></div>
                    <div class="stat-info"><h3 id="dash-pelanggan">0</h3><p>Total Pelanggan</p></div>
                </div>
            </div>

            <div class="section-header"><h3 class="section-title">Pesanan Terbaru</h3></div>
            <div class="recent-list" id="recent-orders-container">
                <div class="empty-state">Memuat data...</div>
            </div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item active"><i class="fas fa-home"></i><span>BERANDA</span></div>
            <div class="nav-item" onclick="window.location.href='list_order.html'"><i class="fas fa-file-alt"></i><span>PESANAN</span></div>
            <div class="nav-item" onclick="window.location.href='pelanggan_tambah.html'"><i class="fas fa-users"></i><span>CUSTOMERS</span></div>
            <div class="nav-item" onclick="window.location.href='profile.html'"><i class="fas fa-user-circle"></i><span>PROFILE</span></div>
        </div>
    </div>

    <script>
        const API_URL = 'https://laundry-backend-api-production.up.railway.app/api';

        window.onload = async () => {
            const namaKasir = localStorage.getItem('nama_kasir') || 'Kasir';
            document.getElementById('greet-name').innerText = namaKasir.split(' ')[0];
            document.getElementById('user-initial').innerText = namaKasir.charAt(0).toUpperCase();

            try {
                // Fetch Statistik Dashboard
                const resDash = await fetch(`${API_URL}/dashboard`);
                const resultDash = await resDash.json();

                if (resultDash.status === 'SUKSES') {
                    document.getElementById('dash-pendapatan').innerText = 'Rp ' + new Intl.NumberFormat('id-ID').format(resultDash.data.pendapatan || 0);
                    document.getElementById('dash-proses').innerText = resultDash.data.proses || 0;
                    document.getElementById('dash-selesai').innerText = resultDash.data.selesai || 0;
                    document.getElementById('dash-pelanggan').innerText = resultDash.data.pelanggan || 0;
                }

                // Fetch Pesanan Terbaru (PERBAIKAN ARRAY DI SINI)
                const resOrder = await fetch(`${API_URL}/pesanan`);
                const resultOrder = await resOrder.json();
                const container = document.getElementById('recent-orders-container');

                if (Array.isArray(resultOrder) && resultOrder.length > 0) {
                    container.innerHTML = resultOrder.slice(0, 3).map(p => {
                        const statusColor = p.status_pesanan === 'Selesai' ? '#10B981' : '#f59e0b';
                        return `
                            <div class="recent-item">
                                <div class="recent-left">
                                    <div class="recent-icon"><i class="fas fa-tshirt"></i></div>
                                    <div class="recent-info">
                                        <h4>${p.nama_pelanggan || 'Pelanggan'}</h4>
                                        <p>Nota #${p.id}</p>
                                    </div>
                                </div>
                                <div class="recent-right">
                                    <div class="recent-price">Rp ${new Intl.NumberFormat('id-ID').format(p.total_harga || 0)}</div>
                                    <div class="recent-status" style="color:${statusColor}">${p.status_pesanan}</div>
                                </div>
                            </div>
                        `;
                    }).join('');
                } else {
                    container.innerHTML = '<div class="empty-state">Belum ada pesanan.</div>';
                }
            } catch (e) {
                console.error(e);
                document.getElementById('recent-orders-container').innerHTML = '<div class="empty-state" style="color:red;">Gagal terhubung ke database.</div>';
            }
        };
    </script>
</body>
</html>
