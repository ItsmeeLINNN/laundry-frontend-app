<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spincycle - Beranda</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* CSS Tema Spincycle Ultimate (Sesuai kode aslimu) */
        :root { 
            --dark-blue: #15428F; --light-blue: #9BB8EA; --bg-main: #f4f7fb;
            --text-main: #2d3748; --text-sub: #718096; 
            --success: #10B981; --warning: #f59e0b; --danger: #e53e3e;
            --card-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .mobile-screen { background: var(--bg-main); width: 375px; height: 750px; border-radius: 30px; box-shadow: 0 15px 45px rgba(21, 66, 143, 0.15); border: 10px solid #333; position: relative; overflow: hidden; display: flex; flex-direction: column; }

        /* Header */
        .header { background: white; padding: 25px 20px 15px 20px; border-radius: 0 0 20px 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.02); display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 5; }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, var(--light-blue), var(--dark-blue)); color: white; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 16px; border: 2px solid white; box-shadow: 0 2px 8px rgba(21,66,143,0.3); }
        .greet p { font-size: 10px; color: var(--text-sub); text-transform: uppercase; margin-bottom: 2px; }
        .greet h2 { font-size: 15px; color: var(--text-main); font-weight: 700; }
        .btn-notif { background: #f0f4f8; border: none; width: 38px; height: 38px; border-radius: 50%; color: var(--dark-blue); font-size: 16px; cursor: pointer; position: relative; }
        .notif-dot { position: absolute; top: 8px; right: 10px; width: 8px; height: 8px; background: var(--danger); border-radius: 50%; }

        .scrollable-content { flex: 1; overflow-y: auto; padding: 20px 20px 80px 20px; scrollbar-width: none; }
        .scrollable-content::-webkit-scrollbar { display: none; }

        /* Revenue Card */
        .revenue-card { background: linear-gradient(135deg, var(--dark-blue) 0%, #2a5eb5 100%); border-radius: 20px; padding: 25px 20px; color: white; margin-bottom: 25px; }
        .rev-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 11px; opacity: 0.8; }
        .revenue-card h1 { font-size: 28px; font-weight: 800; }

        /* Quick Actions */
        .quick-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 25px; }
        .action-btn { display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; cursor: pointer; }
        .action-icon { width: 50px; height: 50px; border-radius: 16px; background: white; display: flex; justify-content: center; align-items: center; font-size: 20px; box-shadow: var(--card-shadow); }
        .action-btn span { font-size: 10px; color: var(--text-main); font-weight: 600; text-align: center; }

        /* Rangkuman Statistik */
        .section-header { display: flex; justify-content: space-between; margin-bottom: 12px; }
        .section-title { font-size: 15px; font-weight: 800; color: var(--text-main); }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 25px; }
        .stat-card { background: white; border-radius: 16px; padding: 15px; box-shadow: var(--card-shadow); display: flex; align-items: center; gap: 12px; }
        .stat-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 18px; }
        .stat-info h3 { font-size: 20px; font-weight: 800; color: var(--dark-blue); }
        .stat-info p { font-size: 10px; color: var(--text-sub); font-weight: 700; text-transform: uppercase; }

        /* Pesanan Terbaru */
        .recent-list { display: flex; flex-direction: column; gap: 10px; }
        .recent-item { background: white; padding: 12px 15px; border-radius: 16px; box-shadow: var(--card-shadow); display: flex; justify-content: space-between; align-items: center; }
        
        .bottom-nav { position: absolute; bottom: 0; width: 100%; background-color: white; height: 65px; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #eee; z-index: 10; }
        .nav-item { text-align: center; color: #a0aec0; font-size: 9px; cursor: pointer; }
        .nav-item.active { color: var(--dark-blue); font-weight: 700; }
    </style>
</head>
<body>
    <div class="mobile-screen">
        <div class="header">
            <div class="user-info">
                <div class="avatar" id="user-initial">A</div>
                <div class="greet">
                    <p>Halo, Selamat Bekerja!</p>
                    <h2 id="greet-name">Memuat...</h2>
                </div>
            </div>
            <button class="btn-notif"><i class="fas fa-bell"></i><div class="notif-dot"></div></button>
        </div>

        <div class="scrollable-content">
            <div class="revenue-card">
                <div class="rev-header"><span>OMSET HARI INI</span><span>IDR</span></div>
                <h1 id="dash-pendapatan">Rp 0</h1>
            </div>

            <div class="quick-actions">
                <a href="transaksi_baru.html" class="action-btn"><div class="action-icon" style="color:#15428F"><i class="fas fa-plus"></i></div><span>Order Baru</span></a>
                <a href="pelanggan_tambah.html" class="action-btn"><div class="action-icon" style="color:#10B981"><i class="fas fa-user-plus"></i></div><span>Pelanggan</span></a>
                <a href="layanan.html" class="action-btn"><div class="action-icon" style="color:#f59e0b"><i class="fas fa-tags"></i></div><span>Layanan</span></a>
                <a href="list_order.html" class="action-btn"><div class="action-icon" style="color:#805ad5"><i class="fas fa-search-dollar"></i></div><span>Cek Nota</span></a>
            </div>

            <div class="section-header"><h3 class="section-title">Ringkasan Operasional</h3></div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon" style="background:#fef3c7; color:#f59e0b"><i class="fas fa-clock"></i></div>
                    <div class="stat-info"><h3 id="dash-proses">0</h3><p>DIPROSES</p></div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background:#d1fae5; color:#10B981"><i class="fas fa-check-double"></i></div>
                    <div class="stat-info"><h3 id="dash-selesai">0</h3><p>SELESAI</p></div>
                </div>
                <div class="stat-card" style="grid-column: span 2;">
                    <div class="stat-icon" style="background:#e0eafc; color:#15428F"><i class="fas fa-users"></i></div>
                    <div class="stat-info"><h3 id="dash-pelanggan">0</h3><p>TOTAL PELANGGAN</p></div>
                </div>
            </div>

            <div class="section-header"><h3 class="section-title">Pesanan Terbaru</h3></div>
            <div class="recent-list" id="recent-orders-container">
                <div style="text-align:center; padding:20px;">Memuat data...</div>
            </div>
        </div> 

        <div class="bottom-nav">
            <div class="nav-item active"><i class="fas fa-home"></i><br>BERANDA</div>
            <div class="nav-item" onclick="window.location.href='list_order.html'"><i class="fas fa-file-alt"></i><br>PESANAN</div>
            <div class="nav-item" onclick="window.location.href='pelanggan_tambah.html'"><i class="fas fa-users"></i><br>CUSTOMERS</div>
            <div class="nav-item" onclick="window.location.href='profile.html'"><i class="fas fa-user"></i><br>PROFILE</div>
        </div>
    </div>

    <script>
        const API_URL = 'https://laundry-backend-api-production.up.railway.app/api';

        window.onload = async () => {
            // Set User
            const namaKasir = localStorage.getItem('nama_kasir') || 'Kasir';
            document.getElementById('greet-name').innerText = namaKasir.split(' ')[0];
            document.getElementById('user-initial').innerText = namaKasir.charAt(0).toUpperCase();
            
            try {
                // 1. Fetch Statistik
                const resDash = await fetch(`${API_URL}/dashboard`);
                const resultDash = await resDash.json();
                console.log("Stats Data:", resultDash); 

                if(resultDash.status === 'SUKSES') {
                    document.getElementById('dash-pendapatan').innerText = 'Rp ' + new Intl.NumberFormat('id-ID').format(resultDash.data.pendapatan || 0);
                    document.getElementById('dash-proses').innerText = resultDash.data.proses || 0;
                    document.getElementById('dash-selesai').innerText = resultDash.data.selesai || 0;
                    document.getElementById('dash-pelanggan').innerText = resultDash.data.pelanggan || 0;
                }

                // 2. Fetch Pesanan Terbaru
                const resOrder = await fetch(`${API_URL}/pesanan`);
                const resultOrder = await resOrder.json();
                console.log("Orders Data:", resultOrder);

                const container = document.getElementById('recent-orders-container');
                if(resultOrder.status === 'SUKSES' && resultOrder.data.length > 0) {
                    container.innerHTML = resultOrder.data.slice(0, 3).map(p => `
                        <div class="recent-item">
                            <div style="display:flex; align-items:center; gap:10px;">
                                <div style="width:35px; height:35px; background:#f0f4f8; border-radius:10px; display:flex; justify-content:center; align-items:center;">
                                    <i class="fas fa-tshirt" style="color:#718096"></i>
                                </div>
                                <div>
                                    <h4 style="font-size:13px;">${p.nama_pelanggan}</h4>
                                    <p style="font-size:10px; color:#718096">${p.nomor_nota || 'Nota #' + p.id}</p>
                                </div>
                            </div>
                            <div style="text-align:right;">
                                <div style="font-size:12px; font-weight:700; color:#15428F">Rp ${new Intl.NumberFormat('id-ID').format(p.total_harga)}</div>
                                <div style="font-size:9px; font-weight:700; color:${p.status_pesanan === 'Selesai' ? '#10B981' : '#f59e0b'}">${p.status_pesanan}</div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<div style="text-align:center; padding:10px;">Belum ada pesanan.</div>';
                }
            } catch(e) { 
                console.error("DEBUG ERROR:", e);
                alert("Gagal memuat data! Buka Console (F12) untuk melihat error.");
            }
        };
    </script>
</body>
</html>
