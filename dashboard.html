<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spincycle - Beranda</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --dark-blue: #15428F; --light-blue: #9BB8EA; --bg-main: #f4f7fb;
            --text-main: #2d3748; --text-sub: #718096; 
            --success: #10B981; --warning: #f59e0b; --danger: #e53e3e;
            --card-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .mobile-screen { background: var(--bg-main); width: 375px; height: 750px; border-radius: 30px; box-shadow: 0 15px 45px rgba(21, 66, 143, 0.15); border: 10px solid #333; position: relative; overflow: hidden; display: flex; flex-direction: column; }

        /* HEADER */
        .header { background: white; padding: 25px 20px 15px 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.02); display: flex; justify-content: space-between; align-items: center; }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--dark-blue); color: white; display: flex; justify-content: center; align-items: center; font-weight: bold; }
        .greet p { font-size: 10px; color: var(--text-sub); text-transform: uppercase; }
        .greet h2 { font-size: 15px; font-weight: 700; color: var(--text-main); }

        /* OMSET CARD */
        .revenue-card { background: var(--dark-blue); border-radius: 20px; padding: 25px 20px; color: white; margin: 20px; }
        .rev-header { display: flex; justify-content: space-between; margin-bottom: 8px; opacity: 0.8; font-size: 11px; }
        .revenue-card h1 { font-size: 28px; font-weight: 800; }

        /* STATS GRID - FONT DIPERBAIKI */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 0 20px 20px 20px; }
        .stat-card { background: white; border-radius: 16px; padding: 15px; box-shadow: var(--card-shadow); display: flex; align-items: center; gap: 12px; }
        .stat-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 18px; }
        .stat-info h3 { font-size: 20px; font-weight: 800; color: var(--dark-blue); } /* Font dibuat tebal dan besar */
        .stat-info p { font-size: 10px; font-weight: 700; color: var(--text-sub); text-transform: uppercase; } /* Label dibuat tegas */

        .bottom-nav { position: absolute; bottom: 0; width: 100%; background-color: white; height: 65px; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #eee; }
        .nav-item { text-align: center; color: #a0aec0; font-size: 9px; cursor: pointer; }
        .nav-item.active { color: var(--dark-blue); font-weight: 700; }
    </style>
</head>
<body>
    <div class="mobile-screen">
        <div class="header">
            <div class="user-info">
                <div class="avatar" id="user-initial">A</div>
                <div class="greet">
                    <p>Halo, Selamat Bekerja!</p>
                    <h2 id="greet-name">Memuat...</h2>
                </div>
            </div>
        </div>

        <div class="scrollable-content">
            <div class="revenue-card">
                <div class="rev-header"><span>OMSET HARI INI</span><span>IDR</span></div>
                <h1 id="dash-pendapatan">Rp 0</h1>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon" style="background:#fef3c7; color:#f59e0b"><i class="fas fa-clock"></i></div>
                    <div class="stat-info"><h3 id="dash-proses">0</h3><p>DIPROSES</p></div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background:#d1fae5; color:#10B981"><i class="fas fa-check-double"></i></div>
                    <div class="stat-info"><h3 id="dash-selesai">0</h3><p>SELESAI</p></div>
                </div>
                <div class="stat-card" style="grid-column: span 2;">
                    <div class="stat-icon" style="background:#e0eafc; color:#15428F"><i class="fas fa-users"></i></div>
                    <div class="stat-info"><h3 id="dash-pelanggan">0</h3><p>TOTAL PELANGGAN</p></div>
                </div>
            </div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item active"><i class="fas fa-home"></i><br>BERANDA</div>
            <div class="nav-item" onclick="window.location.href='list_order.html'"><i class="fas fa-file-alt"></i><br>PESANAN</div>
        </div>
    </div>

    <script>
        const API_URL = 'https://laundry-backend-api-production.up.railway.app/api';

        window.onload = async () => {
            const namaKasir = localStorage.getItem('nama_kasir') || 'Kasir';
            document.getElementById('greet-name').innerText = namaKasir.split(' ')[0];
            document.getElementById('user-initial').innerText = namaKasir.charAt(0).toUpperCase();
            
            try {
                console.log("Menghubungkan ke:", `${API_URL}/dashboard`);
                const resDash = await fetch(`${API_URL}/dashboard`);
                const resultDash = await resDash.json();
                
                console.log("Data Backend:", resultDash); // <--- INI UNTUK DEBUGGING

                if(resultDash.status === 'SUKSES') {
                    const data = resultDash.data;
                    document.getElementById('dash-pendapatan').innerText = 'Rp ' + new Intl.NumberFormat('id-ID').format(data.pendapatan || 0);
                    document.getElementById('dash-proses').innerText = data.proses || 0;
                    document.getElementById('dash-selesai').innerText = data.selesai || 0;
                    document.getElementById('dash-pelanggan').innerText = data.pelanggan || 0;
                } else {
                    console.error("Status Backend bukan SUKSES");
                }
            } catch(e) { 
                console.error("Gagal koneksi ke API:", e); 
                alert("Gagal koneksi ke server. Cek console (F12) untuk detail.");
            }
        };
    </script>
</body>
</html>
