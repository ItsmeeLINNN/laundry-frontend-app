<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spincycle Laundry - Transaksi Baru</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --dark-blue: #15428f;
            --light-blue: #9bb8ea;
            --badge-blue: #88b0e6;
            --bg-body: #e0eafc;
            --bg-panel: #ffffff;
            --text-main: #333333;
            --text-sub: #666666;
            --border: #e5e7eb;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* Mencegah layar utama bergeser */
            background-color: #e0eafc; /* Warna background utama */
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: var(--text-main);
        }

        .mobile-screen {
            width: 100%;
            height: 100%;
            border-radius: 0; /* Menghilangkan sudut melengkung */
            border: none; /* Menghilangkan bingkai hitam */
            box-shadow: none; /* Menghilangkan bayangan */
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, var(--bg-panel) 0%, #e6f0fa 100%);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 25px 20px 15px;
        }

        .header button {
            border: none;
            background: transparent;
            color: var(--dark-blue);
            cursor: pointer;
            font-size: 18px;
            padding: 0;
        }

        .header-title {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            color: var(--dark-blue);
        }

        .header-spacer {
            width: 18px;
        }

        .progress-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
            padding: 0 20px;
        }

        .progress-step {
            width: 40px;
            height: 6px;
            border-radius: 5px;
            background-color: #dfdfdf;
        }

        .progress-step.active {
            background-color: var(--badge-blue);
        }

        .scrollable-content {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px 150px;
            scrollbar-width: none;
        }

        .scrollable-content::-webkit-scrollbar {
            display: none;
        }

        .section-title {
            margin: 15px 0 10px;
            font-size: 14px;
            font-weight: 700;
            color: var(--dark-blue);
        }

        .card {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 10px;
        }

        .card-label {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 9px;
            font-weight: 700;
        }

        .label-kiloan {
            background: #e0eafc;
            color: #15428f;
        }

        .label-express {
            background: #fef3c7;
            color: #d97706;
        }

        .service-name {
            margin: 0 0 4px;
            font-size: 13px;
            font-weight: 800;
            color: #111827;
        }

        .service-price {
            margin: 0;
            font-size: 11px;
            color: #15428f;
            font-weight: 700;
        }

        .quantity-controls {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .qty-button {
            width: 28px;
            height: 28px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            color: #111827;
            background: #f0f4f8;
        }

        .qty-button.primary {
            background: var(--dark-blue);
            color: white;
        }

        .qty-value {
            min-width: 26px;
            text-align: center;
            font-weight: 700;
            font-size: 13px;
        }

        .form-label {
            display: block;
            margin-bottom: 5px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-sub);
            text-transform: uppercase;
        }

        .form-input,
        .form-textarea {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 2px solid #eee;
            background: #ffffff;
            color: var(--text-main);
            font-size: 13px;
            outline: none;
            transition: border-color 0.25s ease;
            margin-bottom: 10px;
        }

        .form-input:focus,
        .form-textarea:focus {
            border-color: var(--light-blue);
        }

        .form-textarea {
            resize: vertical;
            min-height: 80px;
        }

        .disabled-input {
            background-color: #f8fafc;
            border-color: #e2e8f0;
            color: #64748b;
            cursor: not-allowed;
        }

        .floating-summary {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 65px;
            background: #ffffff;
            border-top: 1px solid #eee;
            box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.05);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 5;
        }

        .summary-text p {
            margin: 0 0 4px;
            font-size: 11px;
            color: var(--text-sub);
        }

        .summary-text h3 {
            margin: 0;
            font-size: 16px;
            color: var(--dark-blue);
            font-weight: 700;
        }

        .btn-lanjut {
            border: none;
            border-radius: 12px;
            padding: 12px 18px;
            color: #ffffff;
            background: var(--dark-blue);
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .btn-lanjut:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-lanjut:active:not(:disabled) {
            transform: scale(0.98);
        }

        .bottom-nav {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 65px;
            background: #ffffff;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 10;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 9px;
            color: #94a3b8;
            text-decoration: none;
            cursor: pointer;
        }

        .nav-item i {
            font-size: 18px;
        }

        .nav-item.active {
            color: var(--dark-blue);
            font-weight: 700;
        }
    </style>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/app-ui.js"></script>
    <script src="assets/js/access-guard.js"></script>
    <link rel="stylesheet" href="assets/css/mobile-fit.css">
</head>
<body>
    <div class="mobile-screen">
        <header class="header">
            <button type="button" aria-label="Kembali ke dashboard" onclick="window.location.href='dashboard.html'">
                <i class="fas fa-arrow-left"></i>
            </button>
            <h1 class="header-title">Transaksi Baru</h1>
            <div class="header-spacer" aria-hidden="true"></div>
        </header>

        <div class="progress-container" aria-label="Progres transaksi">
            <span class="progress-step active"></span>
            <span class="progress-step"></span>
            <span class="progress-step"></span>
        </div>

        <main class="scrollable-content">
            <section>
                <h2 class="section-title">1. Pilih Pelanggan</h2>
                <label class="form-label" for="pilih-pelanggan">Nama Pelanggan</label>
                <select id="pilih-pelanggan" class="form-input" onchange="hitungSubtotal()">
                    <option value="">-- Memuat data pelanggan... --</option>
                </select>
            </section>

            <section>
                <h2 class="section-title">2. Pilih Jenis Cucian</h2>
                <div id="katalog-container">
                    <div class="card" style="text-align:center; color:#888;">
                        <i class="fas fa-spinner fa-spin"></i> Memuat katalog layanan...
                    </div>
                </div>
            </section>

            <section>
                <h2 class="section-title">3. Paket Kecepatan</h2>
                <label class="form-label" for="paket-kecepatan">Pilih Paket</label>
                <select id="paket-kecepatan" class="form-input" onchange="hitungSubtotal()">
                    <option value="1" data-jam="72" data-multiplier="1">Hemat 3 Hari (Harga Normal)</option>
                    <option value="2" data-jam="24" data-multiplier="1.2" selected>Reguler 1 Hari (+20% Harga)</option>
                    <option value="3" data-jam="6" data-multiplier="2">Express 6 Jam (2x Harga)</option>
                </select>
            </section>

            <section>
                <h2 class="section-title">4. Pengiriman</h2>
                <label class="form-label" for="metode-pengiriman">Metode</label>
                <input id="metode-pengiriman" class="form-input disabled-input" type="text" value="Pelanggan Ambil Sendiri" readonly>
            </section>

            <section>
                <h2 class="section-title">5. Catatan (Opsional)</h2>
                <label class="form-label" for="catatan">Catatan</label>
                <textarea id="catatan" class="form-textarea" placeholder="Contoh: Tolong jangan terlalu panas setrikanya"></textarea>
            </section>
        </main>

        <div class="floating-summary">
            <div class="summary-text">
                <p>Estimasi Subtotal</p>
                <h3 id="total-price">Rp 0</h3>
            </div>
            <button class="btn-lanjut" id="btn-lanjut" onclick="lanjutKeRingkasan()" disabled>
                Lanjutkan
                <i class="fas fa-arrow-right"></i>
            </button>
        </div>

        <nav class="bottom-nav" aria-label="Navigasi aplikasi">
            <div class="nav-item" onclick="window.location.href='dashboard.html'">
                <i class="fas fa-home"></i>
                <span>BERANDA</span>
            </div>
            <div class="nav-item active" onclick="window.location.href='list_order.html'">
                <i class="fas fa-file-alt"></i>
                <span>PESANAN</span>
            </div>
            <div class="nav-item" onclick="window.location.href='pelanggan_tambah.html'">
                <i class="fas fa-users"></i>
                <span>CUSTOMERS</span>
            </div>
            <div class="nav-item" onclick="window.location.href='profile.html'">
                <i class="fas fa-user-circle"></i>
                <span>PROFILE</span>
            </div>
        </nav>
    </div>

    <script>
        const API_URL = window.LAUNDRY_API_BASE;
        let dataLayanan = [];
        let keranjang = {};

        document.addEventListener('DOMContentLoaded', () => {
            muatDataPelanggan();
            muatKatalogLayanan();
        });

        async function muatDataPelanggan() {
            const select = document.getElementById('pilih-pelanggan');
            try {
                const response = await fetch(`${API_URL}/pelanggan`);
                const result = await response.json();
                let options = '<option value="">-- Pilih Nama Pelanggan --</option>';
                if (result.data && Array.isArray(result.data)) {
                    result.data.forEach((pelanggan) => {
                        options += `<option value="${pelanggan.id}">${pelanggan.name} (${pelanggan.phone})</option>`;
                    });
                }
                select.innerHTML = options;
            } catch (error) {
                select.innerHTML = '<option value="">-- Gagal memuat pelanggan --</option>';
            }
        }

        async function muatKatalogLayanan() {
            const container = document.getElementById('katalog-container');
            try {
                const response = await fetch(`${API_URL}/layanan`);
                const result = await response.json();
                if (result.status === 'SUKSES' && Array.isArray(result.data)) {
                    dataLayanan = result.data;
                    renderKatalogLayanan();
                } else {
                    container.innerHTML = '<div class="card">Tidak ada layanan tersedia.</div>';
                }
            } catch (error) {
                container.innerHTML = '<div class="card" style="color:#dc2626; text-align:center;">Gagal memuat layanan.</div>';
            }
        }

        function renderKatalogLayanan() {
            const container = document.getElementById('katalog-container');
            container.innerHTML = dataLayanan.map((item) => {
                const badgeClass = item.category === 'Kiloan' ? 'label-kiloan' : 'label-express';
                return `
                    <article class="card">
                        <div class="card-header">
                            <div>
                                <span class="card-label ${badgeClass}">${item.category}</span>
                                <h3 class="service-name">${item.service_name}</h3>
                                <p class="service-price">Rp ${new Intl.NumberFormat('id-ID').format(item.price)} / ${item.unit}</p>
                            </div>
                            <div class="quantity-controls">
                                <button type="button" class="qty-button" onclick="ubahQty(${item.id}, -0.5)">-</button>
                                <span id="qty-${item.id}" class="qty-value">0</span>
                                <button type="button" class="qty-button primary" onclick="ubahQty(${item.id}, 0.5)">+</button>
                            </div>
                        </div>
                    </article>
                `;
            }).join('');
        }

        function ubahQty(id, delta) {
            const item = dataLayanan.find((layanan) => layanan.id === id);
            if (!item) return;

            if (!keranjang[id]) {
                keranjang[id] = { ...item, qty: 0 };
            }
            keranjang[id].qty = Math.max(0, keranjang[id].qty + delta);
            document.getElementById(`qty-${id}`).textContent = keranjang[id].qty;
            hitungSubtotal();
        }

        function hitungSubtotal() {
            const pelangganDipilih = document.getElementById('pilih-pelanggan').value;
            const paket = document.getElementById('paket-kecepatan');
            const multiplier = parseFloat(paket.selectedOptions[0].dataset.multiplier) || 1;
            const subtotal = Object.values(keranjang).reduce((total, item) => total + item.price * item.qty, 0);
            const totalEstimasi = subtotal * multiplier;

            document.getElementById('total-price').textContent = `Rp ${new Intl.NumberFormat('id-ID').format(totalEstimasi)}`;
            document.getElementById('btn-lanjut').disabled = !(pelangganDipilih && subtotal > 0);
        }

        function lanjutKeRingkasan() {
            const pelangganSelect = document.getElementById('pilih-pelanggan');
            const paketSelect = document.getElementById('paket-kecepatan');
            const itemTerpilih = Object.values(keranjang).filter((item) => item.qty > 0);

            if (itemTerpilih.length === 0) return;

            // PERBAIKAN: Menyimpan data layanan_id dan berat utama secara aman ke dalam localStorage cache
            localStorage.setItem('trx_layanan_id', itemTerpilih[0].id);
            localStorage.setItem('trx_berat', itemTerpilih[0].qty);

            localStorage.setItem('trx_pelanggan_id', pelangganSelect.value);
            localStorage.setItem('trx_pelanggan_nama', pelangganSelect.selectedOptions[0].text);
            localStorage.setItem('trx_keranjang', JSON.stringify(itemTerpilih));
            localStorage.setItem('trx_kecepatan_val', paketSelect.value);
            localStorage.setItem('trx_kecepatan_nama', paketSelect.selectedOptions[0].text);
            localStorage.setItem('trx_estimasi_jam', paketSelect.selectedOptions[0].dataset.jam);
            localStorage.setItem('trx_multiplier', paketSelect.selectedOptions[0].dataset.multiplier);
            localStorage.setItem('trx_metode_asli', 'ambil_sendiri');
            localStorage.setItem('trx_jarak_km', '0');
            localStorage.setItem('trx_ongkir', '0');
            localStorage.setItem('trx_catatan', document.getElementById('catatan').value.trim() || 'Tidak ada catatan');

            window.location.href = 'ringkasan_pesanan.html';
        }
    </script>
</body>
</html>
