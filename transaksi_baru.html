<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spincycle Laundry - Transaksi Baru</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --dark-blue: #15428F; --light-blue: #9BB8EA; --badge-blue: #88B0E6;
            --bg-card: #E2E4E5; --text-main: #333333; --text-sub: #666666; --success: #10B981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .mobile-screen { background: linear-gradient(180deg, #ffffff 0%, #e6f0fa 100%); width: 375px; height: 750px; border-radius: 30px; box-shadow: 0 15px 45px rgba(21, 66, 143, 0.15); border: 10px solid #333; position: relative; overflow: hidden; display: flex; flex-direction: column; }
        .header { padding: 25px 20px 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .header i { font-size: 18px; color: var(--dark-blue); cursor: pointer; }
        .header h2 { font-size: 18px; color: var(--dark-blue); font-weight: bold; }
        
        .progress-container { display: flex; justify-content: center; gap: 8px; margin-bottom: 15px; }
        .progress-step { height: 6px; width: 40px; background-color: #DFDFDF; border-radius: 5px; }
        .progress-step.active { background-color: var(--badge-blue); }

        .scrollable-content { flex: 1; overflow-y: auto; padding: 0 20px 150px 20px; scrollbar-width: none; }
        .scrollable-content::-webkit-scrollbar { display: none; }
        .section-title { font-size: 14px; font-weight: bold; color: var(--dark-blue); margin: 15px 0 10px 0; }
        
        .form-input { width: 100%; padding: 14px; border: 2px solid #eee; border-radius: 12px; font-size: 13px; color: var(--text-main); background-color: white; outline: none; margin-bottom: 10px; transition: 0.3s; }
        .form-input:focus { border-color: var(--light-blue); }
        .form-label { font-size: 11px; font-weight: bold; color: var(--text-sub); margin-bottom: 5px; display: block; }

        .floating-summary { position: absolute; bottom: 65px; left: 0; right: 0; background-color: white; padding: 15px 20px; border-top: 1px solid #eee; box-shadow: 0 -4px 15px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; z-index: 5; }
        .summary-text p { font-size: 11px; color: var(--text-sub); }
        .summary-text h3 { font-size: 16px; color: var(--dark-blue); font-weight: bold; }
        .btn-lanjut { background-color: var(--dark-blue); color: white; border: none; padding: 12px 20px; border-radius: 12px; font-weight: bold; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s;}
        .btn-lanjut:disabled { background-color: #ccc; cursor: not-allowed; }
        .btn-lanjut:active:not(:disabled) { transform: scale(0.98); }

        .bottom-nav { position: absolute; bottom: 0; width: 100%; background-color: white; height: 65px; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #eee; z-index: 10; }
        .nav-item { text-align: center; color: #94a3b8; font-size: 9px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; align-items: center; }
        .nav-item i { font-size: 18px; }
        .nav-item.active { color: var(--dark-blue); font-weight: bold; }
    </style>
</head>
<body>
    <div class="mobile-screen">
        <div class="header">
            <i class="fas fa-arrow-left" onclick="window.location.href='dashboard.html'"></i>
            <h2>Transaksi Baru</h2>
            <div style="width: 18px;"></div>
        </div>

        <div class="progress-container">
            <div class="progress-step active"></div>
            <div class="progress-step"></div>
            <div class="progress-step"></div>
        </div>

        <div class="scrollable-content">
            <div class="section-title">1. Pilih Pelanggan</div>
            <select id="pilih-pelanggan" class="form-input" onchange="kalkulasiLokal()">
                <option value="">-- Memuat data pelanggan... --</option>
            </select>

            <div class="section-title">2. Pilih Jenis Cucian</div>
            <div id="katalog-container">
                <div style="text-align:center; padding:20px; font-size:12px; color:#888;">
                    <i class="fas fa-spinner fa-spin"></i> Memuat katalog layanan...
                </div>
            </div>

            <div class="section-title" style="margin-top: 20px;">3. Pengiriman</div>
            <select id="metode_pengambilan" class="form-input">
                <option value="ambil_sendiri">Pelanggan Ambil Sendiri</option>
                <option value="antar">Antar ke Alamat</option>
            </select>
            
            <div class="section-title">4. Catatan (Opsional)</div>
            <textarea id="catatan" class="form-input" placeholder="Contoh: Tolong jangan terlalu panas setrikanya" rows="2"></textarea>
        </div> 

        <div class="floating-summary">
            <div class="summary-text">
                <p>Estimasi Subtotal</p>
                <h3 id="total-price">Rp 0</h3>
            </div>
            <button class="btn-lanjut" id="btn-lanjut" onclick="lanjutKeRingkasan()" disabled>
                Lanjutkan <i class="fas fa-arrow-right"></i>
            </button>
        </div>

        <div class="bottom-nav">
            <div class="nav-item" onclick="window.location.href='dashboard.html'"><i class="fas fa-home"></i><span>BERANDA</span></div>
            <div class="nav-item active" onclick="window.location.href='list_order.html'"><i class="fas fa-file-alt"></i><span>PESANAN</span></div>
            <div class="nav-item" onclick="window.location.href='pelanggan_tambah.html'"><i class="fas fa-users"></i><span>CUSTOMERS</span></div>
            <div class="nav-item" onclick="window.location.href='profile.html'"><i class="fas fa-user-circle"></i><span>PROFILE</span></div>
        </div>
    </div>

    <script>
        const API_URL = 'https://laundry-backend-api-production.up.railway.app/api';
        let dataLayanan = [];
        let keranjang = {}; 

        window.onload = async () => {
            await muatDataPelanggan();
            await muatKatalogLayanan();
        };

        // Ambil Data Pelanggan
        async function muatDataPelanggan() {
            try {
                const res = await fetch(`${API_URL}/pelanggan`);
                const data = await res.json();
                let html = '<option value="">-- Pilih Nama Pelanggan --</option>';
                if(data.data && data.data.length > 0) {
                    data.data.forEach(p => { html += `<option value="${p.id}">${p.name} (${p.phone})</option>`; });
                }
                document.getElementById('pilih-pelanggan').innerHTML = html;
            } catch (error) {
                document.getElementById('pilih-pelanggan').innerHTML = '<option value="">-- Gagal memuat pelanggan --</option>';
            }
        }

        // Ambil Katalog Layanan
        async function muatKatalogLayanan() {
            try {
                const res = await fetch(`${API_URL}/layanan`);
                const result = await res.json();
                if(result.status === 'SUKSES') {
                    dataLayanan = result.data;
                    renderKatalog();
                }
            } catch(e) {
                document.getElementById('katalog-container').innerHTML = '<div style="color:red; text-align:center;">Gagal memuat layanan.</div>';
            }
        }

        // Tampilkan Katalog
        function renderKatalog() {
            let html = '';
            dataLayanan.forEach(item => {
                const warnaLabel = item.category === 'Kiloan' ? '#e0eafc' : '#fef3c7';
                const teksLabel = item.category === 'Kiloan' ? '#15428F' : '#d97706';

                html += `
                <div style="background:white; border:1px solid #eee; border-radius:12px; padding:12px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; box-shadow: 0 2px 5px rgba(0,0,0,0.02);">
                    <div>
                        <div style="font-size:9px; background:${warnaLabel}; color:${teksLabel}; padding:3px 8px; border-radius:10px; display:inline-block; margin-bottom:5px; font-weight:800;">${item.category}</div>
                        <div style="font-size:13px; font-weight:800; color:#333; margin-bottom:2px;">${item.service_name}</div>
                        <div style="font-size:11px; color:#15428F; font-weight:bold;">Rp ${new Intl.NumberFormat('id-ID').format(item.price)} / ${item.unit}</div>
                    </div>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <button onclick="ubahQty(${item.id}, -0.5)" style="width:26px; height:26px; border-radius:6px; border:none; background:#f0f4f8; color:#333; font-weight:bold; cursor:pointer;">-</button>
                        <span id="qty-${item.id}" style="font-size:13px; font-weight:bold; width:25px; text-align:center;">0</span>
                        <button onclick="ubahQty(${item.id}, 0.5)" style="width:26px; height:26px; border-radius:6px; border:none; background:#15428F; color:white; font-weight:bold; cursor:pointer;">+</button>
                    </div>
                </div>
                `;
            });
            document.getElementById('katalog-container').innerHTML = html;
        }

        // Menambah/Mengurangi QTY
        function ubahQty(id, delta) {
            if(!keranjang[id]) {
                const itemDb = dataLayanan.find(l => l.id === id);
                keranjang[id] = { ...itemDb, qty: 0 };
            }
            keranjang[id].qty += delta;
            
            if(keranjang[id].qty < 0) keranjang[id].qty = 0;
            
            document.getElementById(`qty-${id}`).innerText = keranjang[id].qty;
            kalkulasiLokal();
        }

        // Hitung Estimasi Subtotal
        function kalkulasiLokal() {
            const pelangganId = document.getElementById('pilih-pelanggan').value;
            const btnLanjut = document.getElementById('btn-lanjut');

            let subtotalLayanan = 0;
            let totalQty = 0;

            Object.values(keranjang).forEach(item => {
                subtotalLayanan += (item.price * item.qty);
                totalQty += item.qty;
            });

            document.getElementById('total-price').innerText = `Rp ${new Intl.NumberFormat('id-ID').format(subtotalLayanan)}`;
            
            btnLanjut.disabled = !(pelangganId && totalQty > 0);
        }

        // Simpan ke LocalStorage dan Pindah Halaman
        function lanjutKeRingkasan() {
            const selectPelanggan = document.getElementById('pilih-pelanggan');
            const metodeVal = document.getElementById('metode_pengambilan').value;

            const namaPelanggan = selectPelanggan.options[selectPelanggan.selectedIndex].text;
            const itemTerpilih = Object.values(keranjang).filter(item => item.qty > 0);

            localStorage.setItem('trx_pelanggan_id', selectPelanggan.value);
            localStorage.setItem('trx_pelanggan_nama', namaPelanggan);
            localStorage.setItem('trx_keranjang', JSON.stringify(itemTerpilih)); 
            localStorage.setItem('trx_metode_asli', metodeVal);
            localStorage.setItem('trx_jarak_km', 0); // Jarak ditiadakan
            localStorage.setItem('trx_ongkir', 0); // Ongkir ditiadakan
            localStorage.setItem('trx_catatan', document.getElementById('catatan').value || 'Tidak ada catatan');

            window.location.href = 'ringkasan_pesanan.html';
        }
    </script>
</body>
</html>
