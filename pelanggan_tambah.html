<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spincycle Laundry - Customers CRUD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* CSS Tema Gradasi Biru-Putih Spincycle */
        :root {
            --dark-blue: #15428F;
            --light-blue: #9BB8EA;
            --text-main: #333333;
            --text-sub: #757575;
            --input-bg: #F5F5F5;
            --danger: #e74c3c;
            --warning: #f39c12;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }

        body {
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%); 
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px;
        }

        .mobile-screen {
            background: linear-gradient(180deg, #ffffff 0%, #e6f0fa 100%);
            width: 375px; height: 750px; border-radius: 30px;
            box-shadow: 0 15px 45px rgba(21, 66, 143, 0.15); 
            border: 10px solid #333; position: relative; display: flex; flex-direction: column; overflow: hidden;
        }

        .header { padding: 25px 20px 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .header i { font-size: 18px; color: var(--dark-blue); cursor: pointer; }
        .header h2 { font-size: 18px; color: var(--dark-blue); font-weight: bold; }
        
        .scrollable-content { flex: 1; overflow-y: auto; padding: 0 20px 20px 20px; scrollbar-width: none; }
        .scrollable-content::-webkit-scrollbar { display: none; }
        
        .title-area { margin-bottom: 15px; }
        .title-area h1 { font-size: 24px; color: var(--dark-blue); margin-bottom: 4px; }
        .title-area p { font-size: 11px; color: var(--dark-blue); opacity: 0.8; }

        /* FORM INPUT */
        .form-card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); margin-bottom: 25px; border-top: 4px solid var(--dark-blue); }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 10px; font-weight: bold; color: var(--text-sub); margin-bottom: 6px; text-transform: uppercase; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper i { position: absolute; left: 15px; color: #bdbdbd; font-size: 13px; }
        .input-wrapper input {
            width: 100%; background-color: var(--input-bg); border: 1px solid #eee;
            border-radius: 10px; padding: 12px 12px 12px 40px; font-size: 13px; outline: none; transition: 0.3s;
        }
        .input-wrapper input:focus { border-color: var(--light-blue); background: white; }
        
        .button-group { display: flex; gap: 10px; margin-top: 15px; }
        .btn-save {
            flex: 1; background-color: var(--dark-blue); color: white; border: none;
            border-radius: 10px; padding: 12px; font-size: 13px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 10px rgba(21, 66, 143, 0.15); transition: 0.2s;
        }
        .btn-cancel {
            display: none; background-color: white; color: var(--danger); border: 1px solid var(--danger);
            border-radius: 10px; padding: 12px 15px; font-size: 13px; font-weight: bold; cursor: pointer;
        }

        /* CUSTOMER LIST */
        .section-title { font-size: 14px; font-weight: bold; color: var(--dark-blue); margin-bottom: 12px; }
        .customer-item {
            background: white; padding: 12px 15px; border-radius: 12px; display: flex;
            justify-content: space-between; align-items: center; margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .cust-main-info { display: flex; align-items: center; gap: 12px; }
        .cust-avatar { width: 35px; height: 35px; border-radius: 50%; background: var(--light-blue); color: var(--dark-blue); display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 14px; }
        .cust-details h4 { font-size: 13px; color: var(--text-main); margin-bottom: 2px; }
        .cust-details p { font-size: 10px; color: var(--text-sub); }
        
        .action-buttons { display: flex; gap: 8px; align-items: center; }
        .btn-icon { background: none; border: none; font-size: 14px; cursor: pointer; padding: 5px; }
        .btn-edit { color: var(--warning); }
        .btn-delete { color: var(--danger); }
        .btn-wa { background-color: #25D366; color: white; width: 28px; height: 28px; border-radius: 50%; display: flex; justify-content: center; align-items: center; text-decoration: none; font-size: 14px; margin-left: 5px; }

        .bottom-nav { background-color: white; height: 65px; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #eee; z-index: 10; }
        .nav-item { text-align: center; color: #94a3b8; font-size: 9px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; align-items: center; }
        .nav-item i { font-size: 18px; }
        .nav-item.active { color: var(--dark-blue); font-weight: bold; }
    </style>
</head>
<body>

    <div class="mobile-screen">
        <div class="header">
            <i class="fas fa-arrow-left" onclick="window.location.href='dashboard.html'"></i>
            <h2>Data Pelanggan</h2>
            <div style="width:18px"></div>
        </div>

        <div class="scrollable-content">
            <div class="title-area">
                <h1 id="form-title">Tambah Data</h1>
                <p>Kelola buku kontak pelanggan toko</p>
            </div>

            <div class="form-card">
                <input type="hidden" id="cust-id" value="">

                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="cust-name" placeholder="Contoh: Justin Dean">
                    </div>
                </div>
                <div class="form-group">
                    <label>Nomor WhatsApp</label>
                    <div class="input-wrapper">
                        <i class="fab fa-whatsapp"></i>
                        <input type="tel" id="cust-phone" placeholder="Contoh: 08123456789">
                    </div>
                </div>
                <div class="form-group">
                    <label>Alamat (Opsional)</label>
                    <div class="input-wrapper">
                        <i class="fas fa-map-marker-alt"></i>
                        <input type="text" id="cust-address" placeholder="Contoh: Jl. Sudirman No. 10">
                    </div>
                </div>
                
                <div class="button-group">
                    <button class="btn-save" id="btn-submit" onclick="simpanPelanggan()">Simpan Pelanggan</button>
                    <button class="btn-cancel" id="btn-cancel" onclick="batalEdit()">Batal</button>
                </div>
            </div>

            <div class="section-title">Daftar Kontak</div>
            <div id="customer-list">
                </div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item" onclick="window.location.href='dashboard.html'"><i class="fas fa-home"></i><span>BERANDA</span></div>
            <div class="nav-item" onclick="window.location.href='list_order.html'"><i class="fas fa-file-alt"></i><span>PESANAN</span></div>
            <div class="nav-item active" onclick="window.location.href='pelanggan_tambah.html'"><i class="fas fa-users"></i><span>CUSTOMERS</span></div>
            <div class="nav-item" onclick="window.location.href='profile.html'"><i class="fas fa-user"></i><span>PROFILE</span></div>
        </div>
    </div>

    <script>
        const apiUrl = 'https://laundry-backend-api-production.up.railway.app/api/pelanggan';

        // 1. READ: Ambil Data
        async function muatDaftarPelanggan() {
            try {
                const response = await fetch(apiUrl);
                const result = await response.json();
                const container = document.getElementById('customer-list');
                container.innerHTML = '';

                if (result.data.length === 0) {
                    container.innerHTML = '<p style="text-align:center; font-size:12px; color:#aaa; padding-top:10px;">Belum ada data pelanggan.</p>';
                    return;
                }

                result.data.forEach(p => {
                    const inisial = p.name ? p.name.charAt(0).toUpperCase() : 'C';
                    // Escape petik tunggal pada parameter fungsi agar tidak error di HTML
                    const safeName = p.name.replace(/'/g, "\\'"); 
                    const safeAddress = p.address ? p.address.replace(/'/g, "\\'") : '';

                    container.innerHTML += `
                        <div class="customer-item">
                            <div class="cust-main-info">
                                <div class="cust-avatar">${inisial}</div>
                                <div class="cust-details">
                                    <h4>${p.name}</h4>
                                    <p>${p.phone}</p>
                                </div>
                            </div>
                            <div class="action-buttons">
                                <button class="btn-icon btn-edit" onclick="siapkanEdit('${p.id}', '${safeName}', '${p.phone}', '${safeAddress}')"><i class="fas fa-edit"></i></button>
                                <button class="btn-icon btn-delete" onclick="hapusPelanggan('${p.id}', '${safeName}')"><i class="fas fa-trash"></i></button>
                                <a href="https://wa.me/${p.phone.replace(/[^0-9]/g, '')}" target="_blank" class="btn-wa"><i class="fab fa-whatsapp"></i></a>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                document.getElementById('customer-list').innerHTML = '<p style="color:red; text-align:center; font-size:11px;">Gagal mengambil data dari server.</p>';
            }
        }

        // 2. TAMPILAN FORM EDIT (Menyiapkan state)
        function siapkanEdit(id, name, phone, address) {
            document.getElementById('form-title').innerText = "Edit Data";
            document.getElementById('cust-id').value = id;
            document.getElementById('cust-name').value = name;
            document.getElementById('cust-phone').value = phone;
            document.getElementById('cust-address').value = address !== 'null' ? address : '';
            
            document.getElementById('btn-submit').innerText = "Update Pelanggan";
            document.getElementById('btn-submit').style.backgroundColor = "var(--warning)";
            document.getElementById('btn-cancel').style.display = "block";
            
            // Scroll otomatis ke atas
            document.querySelector('.scrollable-content').scrollTo({ top: 0, behavior: 'smooth' });
        }

        function batalEdit() {
            document.getElementById('form-title').innerText = "Tambah Data";
            document.getElementById('cust-id').value = "";
            document.getElementById('cust-name').value = "";
            document.getElementById('cust-phone').value = "";
            document.getElementById('cust-address').value = "";
            
            document.getElementById('btn-submit').innerText = "Simpan Pelanggan";
            document.getElementById('btn-submit').style.backgroundColor = "var(--dark-blue)";
            document.getElementById('btn-cancel').style.display = "none";
        }

        // 3. CREATE & UPDATE (Digabung dalam 1 tombol)
        async function simpanPelanggan() {
            const id = document.getElementById('cust-id').value;
            const name = document.getElementById('cust-name').value;
            const phone = document.getElementById('cust-phone').value;
            const address = document.getElementById('cust-address').value;

            if(!name || !phone) {
                alert('Nama dan Nomor HP wajib diisi!');
                return;
            }

            const btn = document.getElementById('btn-submit');
            const originalText = btn.innerText;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Proses...';
            btn.disabled = true;

            // Jika ada ID berarti EDIT (PUT), jika kosong berarti TAMBAH (POST)
            const method = id ? 'PUT' : 'POST';
            const fetchUrl = id ? `${apiUrl}/${id}` : apiUrl;

            try {
                const response = await fetch(fetchUrl, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, phone, address })
                });

                const result = await response.json();

                if (result.status === 'SUKSES') {
                    alert(result.pesan);
                    batalEdit(); // Reset form ke kondisi awal
                    muatDaftarPelanggan(); // Refresh list
                } else {
                    alert(result.pesan);
                }
            } catch (error) {
                alert('Terjadi kesalahan sistem!');
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        // 4. DELETE: Hapus Data
        async function hapusPelanggan(id, name) {
            if(confirm(`Yakin ingin menghapus pelanggan "${name}" dari sistem?`)) {
                try {
                    const response = await fetch(`${apiUrl}/${id}`, { method: 'DELETE' });
                    const result = await response.json();
                    
                    if (result.status === 'SUKSES') {
                        muatDaftarPelanggan(); // Refresh list jika sukses
                    } else {
                        alert(result.pesan);
                    }
                } catch (error) {
                    alert('Gagal menghapus data.');
                }
            }
        }

        window.onload = muatDaftarPelanggan;
    </script>
</body>
</html>
