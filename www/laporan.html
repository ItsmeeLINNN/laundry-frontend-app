<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spincycle Laundry - Laporan Keuangan</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --dark-blue: #15428f;
            --light-blue: #9bb8ea;
            --bg-main: #f4f8ff;
            --text-main: #1f2d3d;
            --text-sub: #8a97a8;
            --success: #10b981;
            --danger: #e53e3e;
            --warning: #f59e0b;
            --card-shadow: 0 6px 18px rgba(21, 66, 143, 0.06);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            overflow: hidden;
        }

        .mobile-screen {
            width: 375px;
            min-height: 750px;
            background: linear-gradient(180deg, #ffffff 0%, #e6f0fa 100%);
            border-radius: 30px;
            border: 10px solid #333;
            box-shadow: 0 15px 45px rgba(21, 66, 143, 0.15);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: #ffffff;
            padding: 25px 20px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eef1f5;
            z-index: 10;
        }

        .header button {
            border: none;
            background: transparent;
            color: var(--dark-blue);
            cursor: pointer;
            font-size: 18px;
            padding: 0;
        }

        .header h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 800;
            color: var(--dark-blue);
        }

        .header-spacer {
            width: 18px;
        }

        .tab-container {
            display: flex;
            background: #ffffff;
            border-bottom: 1px solid #eef1f5;
        }

        .tab-btn {
            flex: 1;
            border: none;
            background: transparent;
            padding: 12px 0;
            font-size: 13px;
            font-weight: 800;
            color: var(--text-sub);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: border-color 0.3s ease, color 0.3s ease;
        }

        .tab-btn.active {
            color: var(--dark-blue);
            border-bottom-color: var(--dark-blue);
        }

        .scrollable-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            scrollbar-width: none;
        }

        .scrollable-content::-webkit-scrollbar {
            display: none;
        }

        .filter-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
        }

        .filter-select,
        .btn-add-exp {
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
        }

        .filter-select {
            padding: 8px 12px;
            border: 1px solid #e2e8f0;
            background: #ffffff;
            color: var(--dark-blue);
            outline: none;
            cursor: pointer;
            flex: 1;
        }

        .btn-add-exp {
            border: none;
            background: var(--danger);
            color: #ffffff;
            padding: 8px 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 10px rgba(229, 62, 62, 0.2);
        }

        .summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .summary-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 15px;
            box-shadow: var(--card-shadow);
        }

        .summary-card.full {
            grid-column: span 2;
            background: linear-gradient(135deg, var(--dark-blue) 0%, #2a5eb5 100%);
            color: #ffffff;
        }

        .summary-title {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 5px;
            opacity: 0.8;
        }

        .summary-value {
            font-size: 18px;
            font-weight: 800;
        }

        .summary-card.full .summary-value {
            font-size: 22px;
            color: #10b981;
        }

        .icon-up,
        .icon-down {
            margin-right: 6px;
        }

        .chart-container {
            background: #ffffff;
            border-radius: 16px;
            padding: 15px;
            box-shadow: var(--card-shadow);
            margin-bottom: 20px;
            min-height: 210px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 800;
            color: var(--dark-blue);
            margin-bottom: 12px;
        }

        .transaction-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-bottom: 20px;
        }

        .trans-item {
            background: #ffffff;
            border-radius: 12px;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--card-shadow);
            border-left: 4px solid var(--success);
        }

        .trans-item.out {
            border-left-color: var(--danger);
        }

        .trans-info h4 {
            font-size: 12px;
            color: var(--text-main);
            font-weight: 800;
            margin: 0 0 3px;
        }

        .trans-info p {
            font-size: 10px;
            color: var(--text-sub);
            margin: 0;
        }

        .trans-amount {
            font-size: 13px;
            font-weight: 800;
            color: var(--success);
        }

        .trans-amount.out {
            color: var(--danger);
        }

        .modal-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-card {
            background: #ffffff;
            width: 100%;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            animation: slideUp 0.25s ease;
            max-width: 380px;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .modal-header h3 {
            margin: 0;
            font-size: 15px;
            color: var(--dark-blue);
            font-weight: 800;
        }

        .modal-header button {
            border: none;
            background: transparent;
            color: var(--text-sub);
            font-size: 20px;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 800;
            color: var(--text-sub);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 13px;
            color: var(--text-main);
            outline: none;
        }

        .form-input:focus {
            border-color: var(--light-blue);
        }

        .btn-submit {
            width: 100%;
            border: none;
            background: var(--danger);
            color: #ffffff;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            margin-top: 5px;
            box-shadow: 0 4px 12px rgba(229, 62, 62, 0.2);
        }
    </style>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/app-ui.js"></script>
    <script src="assets/js/access-guard.js"></script>
    <link rel="stylesheet" href="assets/css/mobile-fit.css">
</head>
<body>
    <div class="mobile-screen">
        <header class="header">
            <button type="button" aria-label="Kembali" onclick="window.location.href='profile.html'">
                <i class="fas fa-arrow-left"></i>
            </button>
            <h2>Laporan Keuangan</h2>
            <div class="header-spacer" aria-hidden="true"></div>
        </header>

        <div class="tab-container">
            <button type="button" class="tab-btn active" onclick="switchTab('pemasukan')">Pemasukan</button>
            <button type="button" class="tab-btn" onclick="switchTab('pengeluaran')">Pengeluaran</button>
        </div>

        <main class="scrollable-content">
            <div class="filter-container">
                <select class="filter-select" id="filter-periode" onchange="prosesDataRealtime()">
                    <option value="harian">Hari Ini</option>
                    <option value="mingguan">7 Hari Terakhir</option>
                    <option value="bulanan" selected>Bulan Ini</option>
                    <option value="tahunan">Tahun Ini</option>
                </select>

                <button type="button" class="btn-add-exp" onclick="bukaModalExpense()">
                    <i class="fas fa-plus-circle"></i>
                    Pengeluaran
                </button>
            </div>

            <div class="summary-grid">
                <div class="summary-card full">
                    <div class="summary-title">Estimasi Laba Bersih</div>
                    <div class="summary-value" id="val-laba">Rp 0</div>
                </div>
                <div class="summary-card">
                    <div class="summary-title"><i class="fas fa-arrow-up icon-up"></i> Total Masuk</div>
                    <div class="summary-value" id="val-masuk">Rp 0</div>
                </div>
                <div class="summary-card">
                    <div class="summary-title"><i class="fas fa-arrow-down icon-down"></i> Total Keluar</div>
                    <div class="summary-value" id="val-keluar">Rp 0</div>
                </div>
            </div>

            <section class="chart-container">
                <canvas id="financialChart"></canvas>
            </section>

            <div class="section-title" id="list-title">Riwayat Finansial</div>
            <div class="transaction-list" id="transaction-container">
                <div style="text-align:center; padding:15px; color:var(--text-sub); font-size:12px;">
                    <i class="fas fa-spinner fa-spin"></i> Memuat data...
                </div>
            </div>
        </main>

        <div class="modal-overlay" id="expenseModal">
            <div class="modal-card">
                <div class="modal-header">
                    <h3>Catat Pengeluaran Operasional</h3>
                    <button type="button" aria-label="Tutup" onclick="tutupModalExpense()">
                        <i class="fas fa-times-circle"></i>
                    </button>
                </div>
                <form id="formPengeluaran" onsubmit="simpanPengeluaran(event)">
                    <div class="form-group">
                        <label for="exp_keterangan">Keterangan / Keperluan</label>
                        <input type="text" id="exp_keterangan" class="form-input" placeholder="Contoh: Beli Deterjen, Plastik Packing" required>
                    </div>
                    <div class="form-group">
                        <label for="exp_nominal">Nominal Pengeluaran (Rp)</label>
                        <input type="number" id="exp_nominal" class="form-input" placeholder="Masukkan jumlah uang" required>
                    </div>
                    <div class="form-group">
                        <label for="exp_tanggal">Tanggal Pengeluaran</label>
                        <input type="date" id="exp_tanggal" class="form-input" required>
                    </div>
                    <button type="submit" class="btn-submit" id="btn-submit-exp">Simpan Pengeluaran</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.LAUNDRY_API_BASE;
        let currentTab = 'pemasukan';
        let myChart = null;
        let listPesananLunas = [];
        let listPengeluaran = [];

        window.onload = () => {
            document.getElementById('exp_tanggal').value = new Date().toISOString().split('T')[0];
            ambilDataSistem();
        };

        async function ambilDataSistem() {
            try {
                const resPesanan = await fetch(`${API_URL}/pesanan`);
                const dataPesanan = await resPesanan.json();
                if (Array.isArray(dataPesanan)) {
                    listPesananLunas = dataPesanan.filter((p) => p.status_pembayaran === 'Lunas');
                }

                try {
                    const resPengeluaran = await fetch(`${API_URL}/pengeluaran`);
                    if (resPengeluaran.ok) {
                        const serverData = await resPengeluaran.json();
                        listPengeluaran = Array.isArray(serverData) ? serverData : [];
                    } else {
                        listPengeluaran = JSON.parse(localStorage.getItem('laundry_pengeluaran_backup')) || [];
                    }
                } catch (error) {
                    listPengeluaran = JSON.parse(localStorage.getItem('laundry_pengeluaran_backup')) || [];
                }

                prosesDataRealtime();
            } catch (error) {
                console.error(error);
                listPengeluaran = JSON.parse(localStorage.getItem('laundry_pengeluaran_backup')) || [];
                prosesDataRealtime();
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            const btns = document.querySelectorAll('.tab-btn');
            btns.forEach((btn, index) => {
                btn.classList.toggle('active', (index === 0 && tab === 'pemasukan') || (index === 1 && tab === 'pengeluaran'));
            });
            document.getElementById('list-title').innerText = tab === 'pemasukan' ? 'Riwayat Pemasukan Terakhir' : 'Riwayat Pengeluaran Terakhir';
            prosesDataRealtime();
        }

        function prosesDataRealtime() {
            const periode = document.getElementById('filter-periode').value;
            const hariIni = new Date();
            const batasTanggal = new Date(hariIni);

            if (periode === 'harian') {
                batasTanggal.setHours(0, 0, 0, 0);
            } else if (periode === 'mingguan') {
                batasTanggal.setDate(hariIni.getDate() - 7);
            } else if (periode === 'bulanan') {
                batasTanggal.setMonth(hariIni.getMonth(), 1);
            } else if (periode === 'tahunan') {
                batasTanggal.setMonth(0, 1);
            }

            const filteredPemasukan = listPesananLunas.filter((p) => new Date(p.tanggal_masuk || p.tanggal_order) >= batasTanggal);
            const filteredPengeluaran = listPengeluaran.filter((p) => new Date(p.tanggal) >= batasTanggal);

            const totalMasuk = filteredPemasukan.reduce((acc, curr) => acc + (parseFloat(curr.total_harga || curr.total_tagihan) || 0), 0);
            const totalKeluar = filteredPengeluaran.reduce((acc, curr) => acc + (parseFloat(curr.nominal) || 0), 0);
            const labaBersih = totalMasuk - totalKeluar;

            document.getElementById('val-masuk').innerText = `Rp ${new Intl.NumberFormat('id-ID').format(totalMasuk)}`;
            document.getElementById('val-keluar').innerText = `Rp ${new Intl.NumberFormat('id-ID').format(totalKeluar)}`;
            document.getElementById('val-laba').innerText = `Rp ${new Intl.NumberFormat('id-ID').format(labaBersih)}`;

            updateChartRealtime(filteredPemasukan, filteredPengeluaran);
            renderListRealtime(currentTab === 'pemasukan' ? filteredPemasukan : filteredPengeluaran);
        }

        function formatYMD(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function updateChartRealtime(pemasukanArr, pengeluaranArr) {
            const ctx = document.getElementById('financialChart').getContext('2d');
            const labels = [];
            const dataPoints = [];

            for (let i = 0; i < 7; i += 1) {
                const d = new Date();
                d.setDate(d.getDate() - (6 - i));
                labels.push(d.toLocaleDateString('id-ID', { weekday: 'short' }));

                const targetDateStr = formatYMD(d);
                if (currentTab === 'pemasukan') {
                    dataPoints.push(
                        pemasukanArr
                            .filter((p) => formatYMD(new Date(p.tanggal_masuk || p.tanggal_order)) === targetDateStr)
                            .reduce((sum, item) => sum + (parseFloat(item.total_harga || item.total_tagihan) || 0), 0)
                    );
                } else {
                    dataPoints.push(
                        pengeluaranArr
                            .filter((p) => formatYMD(new Date(p.tanggal)) === targetDateStr)
                            .reduce((sum, item) => sum + (parseFloat(item.nominal) || 0), 0)
                    );
                }
            }

            const lineColor = currentTab === 'pemasukan' ? '#10B981' : '#e53e3e';
            const bgColor = currentTab === 'pemasukan' ? 'rgba(16, 185, 129, 0.15)' : 'rgba(229, 62, 62, 0.15)';

            if (myChart) {
                myChart.destroy();
            }

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [{
                        data: dataPoints,
                        borderColor: lineColor,
                        backgroundColor: bgColor,
                        borderWidth: 3,
                        pointBackgroundColor: '#ffffff',
                        pointBorderColor: lineColor,
                        pointRadius: 4,
                        fill: true,
                        tension: 0.35,
                    }],
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: '#f0f4f8' },
                            ticks: { font: { size: 9 } },
                        },
                        x: {
                            grid: { display: false },
                            ticks: { font: { size: 9 } },
                        },
                    },
                },
            });
        }

        function renderListRealtime(arrayData) {
            const container = document.getElementById('transaction-container');
            if (arrayData.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:20px; color:#8a97a8; font-size:12px;">Tidak ada riwayat pada periode ini.</div>';
                return;
            }

            container.innerHTML = arrayData.slice(0, 10).map((item) => {
                const isPemasukan = currentTab === 'pemasukan';
                const title = isPemasukan ? `Cucian - ${item.nama_pelanggan || 'Pelanggan Walk-In'}` : item.keterangan;
                const code = isPemasukan ? `ORD-${item.id}` : `EXP-${item.id || 'LOCAL'}`;
                const dateRaw = isPemasukan ? (item.tanggal_masuk || item.tanggal_order) : item.tanggal;
                const formatTgl = new Date(dateRaw).toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
                const nominal = isPemasukan ? (item.total_harga || item.total_tagihan) : item.nominal;

                return `
                    <div class="trans-item ${isPemasukan ? '' : 'out'}">
                        <div class="trans-info">
                            <h4>${title}</h4>
                            <p>${code} • ${formatTgl}</p>
                        </div>
                        <div class="trans-amount ${isPemasukan ? '' : 'out'}">${isPemasukan ? '+' : '-'}Rp ${new Intl.NumberFormat('id-ID').format(nominal)}</div>
                    </div>
                `;
            }).join('');
        }

        function bukaModalExpense() {
            document.getElementById('expenseModal').style.display = 'flex';
        }

        function tutupModalExpense() {
            document.getElementById('expenseModal').style.display = 'none';
            document.getElementById('formPengeluaran').reset();
        }

        async function simpanPengeluaran(event) {
            event.preventDefault();

            const btnSubmit = document.getElementById('btn-submit-exp');
            btnSubmit.disabled = true;
            btnSubmit.innerText = 'Menyimpan...';

            const ket = document.getElementById('exp_keterangan').value;
            const nom = parseFloat(document.getElementById('exp_nominal').value);
            const tgl = document.getElementById('exp_tanggal').value;
            const payload = { keterangan: ket, nominal: nom, tanggal: tgl };

            const localArr = JSON.parse(localStorage.getItem('laundry_pengeluaran_backup')) || [];
            const localDataBaru = { id: Date.now(), ...payload };
            localArr.unshift(localDataBaru);
            localStorage.setItem('laundry_pengeluaran_backup', JSON.stringify(localArr));

            try {
                const response = await fetch(`${API_URL}/pengeluaran`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });

                if (response.ok) {
                    alert('Pengeluaran operasional berhasil dicatat di cloud database!');
                    localArr.shift();
                    localStorage.setItem('laundry_pengeluaran_backup', JSON.stringify(localArr));
                } else {
                    alert('Pengeluaran berhasil disimpan secara lokal di sistem kasir.');
                }
            } catch (error) {
                alert('Pengeluaran berhasil disimpan secara lokal di sistem kasir.');
            }

            tutupModalExpense();
            ambilDataSistem();
            btnSubmit.disabled = false;
            btnSubmit.innerText = 'Simpan Pengeluaran';
        }
    </script>
</body>
</html>
