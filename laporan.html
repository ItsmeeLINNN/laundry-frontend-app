<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spincycle - Laporan Keuangan</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --dark-blue: #15428F; --light-blue: #9BB8EA; --bg-main: #f4f8ff; --text-main: #1f2d3d; --text-sub: #8a97a8; --success: #10B981; --danger: #e53e3e; --card-shadow: 0 6px 18px rgba(21, 66, 143, 0.06); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .mobile-screen { background: var(--bg-main); width: 375px; height: 750px; border-radius: 30px; box-shadow: 0 15px 45px rgba(21, 66, 143, 0.15); border: 8px solid #333; position: relative; overflow: hidden; display: flex; flex-direction: column; }
        
        .header { background: white; padding: 25px 20px 15px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 10; border-bottom: 1px solid #eef1f5; }
        .header i { font-size: 18px; color: var(--dark-blue); cursor: pointer; }
        .header h2 { font-size: 18px; color: var(--dark-blue); font-weight: 800; }

        .tab-container { display: flex; background: white; padding: 0 20px; border-bottom: 1px solid #eef1f5; }
        .tab-btn { flex: 1; text-align: center; padding: 12px 0; font-size: 13px; font-weight: 800; color: var(--text-sub); cursor: pointer; border-bottom: 3px solid transparent; transition: 0.3s; }
        .tab-btn.active { color: var(--dark-blue); border-bottom-color: var(--dark-blue); }

        .scrollable-content { flex: 1; overflow-y: auto; padding: 20px; scrollbar-width: none; }
        .scrollable-content::-webkit-scrollbar { display: none; }

        .filter-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .filter-select { padding: 8px 12px; border-radius: 10px; border: 1px solid #e2e8f0; background: white; font-size: 12px; font-weight: 700; color: var(--dark-blue); outline: none; cursor: pointer;}
        
        /* Summary Cards */
        .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .summary-card { background: white; border-radius: 16px; padding: 15px; box-shadow: var(--card-shadow); }
        .summary-card.full { grid-column: span 2; background: linear-gradient(135deg, var(--dark-blue) 0%, #2a5eb5 100%); color: white; }
        .summary-title { font-size: 10px; font-weight: 800; text-transform: uppercase; margin-bottom: 5px; opacity: 0.8; }
        .summary-value { font-size: 18px; font-weight: 800; }
        .summary-card.full .summary-value { font-size: 24px; color: #10B981; }

        .summary-card .icon-up { color: var(--success); }
        .summary-card .icon-down { color: var(--danger); }

        /* Chart Container */
        .chart-container { background: white; border-radius: 16px; padding: 15px; box-shadow: var(--card-shadow); margin-bottom: 20px; height: 220px; }
        
        .section-title { font-size: 14px; font-weight: 800; color: var(--dark-blue); margin-bottom: 12px; }
        
        /* Transaksi Detail */
        .transaction-list { display: flex; flex-direction: column; gap: 10px; padding-bottom: 20px; }
        .trans-item { background: white; border-radius: 12px; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--card-shadow); border-left: 4px solid var(--success); }
        .trans-item.out { border-left-color: var(--danger); }
        .trans-info h4 { font-size: 12px; color: var(--text-main); font-weight: 800; margin-bottom: 3px; }
        .trans-info p { font-size: 10px; color: var(--text-sub); }
        .trans-amount { font-size: 13px; font-weight: 800; color: var(--success); }
        .trans-amount.out { color: var(--danger); }
    </style>
</head>
<body>
    <div class="mobile-screen">
        <div class="header">
            <i class="fas fa-arrow-left" onclick="window.location.href='profile.html'"></i>
            <h2>Laporan Keuangan</h2>
            <div style="width: 18px;"></div>
        </div>

        <div class="tab-container">
            <div class="tab-btn active" onclick="switchTab('pemasukan')">Pemasukan</div>
            <div class="tab-btn" onclick="switchTab('pengeluaran')">Pengeluaran</div>
        </div>

        <div class="scrollable-content">
            
            <div class="filter-container">
                <div style="font-size: 13px; font-weight: 800; color: var(--text-main);">Rentang Waktu:</div>
                <select class="filter-select" id="filter-periode" onchange="renderData()">
                    <option value="harian" id="opt-harian">Harian (Hari Ini)</option>
                    <option value="mingguan">Mingguan</option>
                    <option value="bulanan" selected>Bulanan</option>
                    <option value="tahunan">Tahunan</option>
                </select>
            </div>

            <div class="summary-grid">
                <div class="summary-card full">
                    <div class="summary-title" style="color: white;">Laba Bersih</div>
                    <div class="summary-value" id="val-laba">Rp 0</div>
                </div>
                <div class="summary-card">
                    <div class="summary-title" style="color: var(--text-sub);"><i class="fas fa-arrow-up icon-up"></i> Total Masuk</div>
                    <div class="summary-value" id="val-masuk" style="color: var(--text-main);">Rp 0</div>
                </div>
                <div class="summary-card">
                    <div class="summary-title" style="color: var(--text-sub);"><i class="fas fa-arrow-down icon-down"></i> Total Keluar</div>
                    <div class="summary-value" id="val-keluar" style="color: var(--text-main);">Rp 0</div>
                </div>
            </div>

            <div class="chart-container">
                <canvas id="financialChart"></canvas>
            </div>

            <div class="section-title" id="list-title">Riwayat Pemasukan Terakhir</div>
            <div class="transaction-list" id="transaction-container">
                </div>

        </div>
    </div>

    <script>
        let currentTab = 'pemasukan';
        let myChart = null;

        /* ==========================================
           DATA DUMMY (SEMENTARA)
           Gunakan ini sampai API Backend Laporan siap.
        ============================================= */
        const dummyPemasukan = [150000, 230000, 180000, 310000, 400000, 250000, 500000];
        const dummyPengeluaran = [50000, 20000, 100000, 0, 75000, 10000, 200000];
        const labelHari = ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'];

        window.onload = () => {
            // Proteksi Halaman (Opsional, pastikan hanya admin yang bisa buka lewat URL)
            const role = localStorage.getItem('role_kasir') || 'Karyawan';
            if (role !== 'Admin' && role !== 'Admin Besar') {
                alert("Akses Ditolak! Hanya Admin yang boleh melihat laporan keuangan.");
                window.location.href = 'profile.html';
                return;
            }
            renderData();
        };

        function switchTab(tab) {
            currentTab = tab;
            
            // Ubah class active
            const btns = document.querySelectorAll('.tab-btn');
            btns[0].classList.toggle('active', tab === 'pemasukan');
            btns[1].classList.toggle('active', tab === 'pengeluaran');
            
            document.getElementById('list-title').innerText = tab === 'pemasukan' ? 'Riwayat Pemasukan Terakhir' : 'Riwayat Pengeluaran Terakhir';
            
            renderData();
        }

        async function renderData() {
            const periode = document.getElementById('filter-periode').value;
            
            // TODO: Nanti ganti dengan pemanggilan Fetch API ke Backend
            // const res = await fetch(`https://backend.app/api/laporan/${currentTab}?periode=${periode}`);
            // const data = await res.json();
            
            // Untuk saat ini, kita gunakan fungsi update simulasi
            updateSummaryCards();
            updateChart();
            renderList();
        }

        function updateSummaryCards() {
            // Simulasi kalkulasi data (Di realita ini dari database)
            const totalMasuk = dummyPemasukan.reduce((a, b) => a + b, 0);
            const totalKeluar = dummyPengeluaran.reduce((a, b) => a + b, 0);
            const laba = totalMasuk - totalKeluar;

            document.getElementById('val-masuk').innerText = 'Rp ' + new Intl.NumberFormat('id-ID').format(totalMasuk);
            document.getElementById('val-keluar').innerText = 'Rp ' + new Intl.NumberFormat('id-ID').format(totalKeluar);
            document.getElementById('val-laba').innerText = 'Rp ' + new Intl.NumberFormat('id-ID').format(laba);
        }

        function updateChart() {
            const ctx = document.getElementById('financialChart').getContext('2d');
            
            // Konfigurasi Warna berdasarkan Tab
            const isPemasukan = currentTab === 'pemasukan';
            const chartData = isPemasukan ? dummyPemasukan : dummyPengeluaran;
            const lineColor = isPemasukan ? '#10B981' : '#e53e3e';
            const bgColor = isPemasukan ? 'rgba(16, 185, 129, 0.2)' : 'rgba(229, 62, 62, 0.2)';

            if (myChart) { myChart.destroy(); } // Hapus grafik lama sebelum render baru

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labelHari,
                    datasets: [{
                        label: isPemasukan ? 'Pemasukan (Rp)' : 'Pengeluaran (Rp)',
                        data: chartData,
                        borderColor: lineColor,
                        backgroundColor: bgColor,
                        borderWidth: 3,
                        pointBackgroundColor: 'white',
                        pointBorderColor: lineColor,
                        pointRadius: 4,
                        fill: true,
                        tension: 0.4 // Membuat garis melengkung estetik
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, grid: { borderDash: [5, 5], color: '#f0f4f8' }, ticks: { font: { size: 10 } } },
                        x: { grid: { display: false }, ticks: { font: { size: 10 } } }
                    }
                }
            });
        }

        function renderList() {
            const container = document.getElementById('transaction-container');
            let html = '';

            // Simulasi List Data
            if (currentTab === 'pemasukan') {
                html += buatListHtml('ORD-150', 'Cucian Kiloan (Budi)', 150000, 'in');
                html += buatListHtml('ORD-149', 'Cucian Express (Siti)', 80000, 'in');
                html += buatListHtml('ORD-148', 'Cuci Selimut (Andi)', 50000, 'in');
            } else {
                html += buatListHtml('PGL-01', 'Beli Deterjen 5 Liter', 75000, 'out');
                html += buatListHtml('PGL-02', 'Bayar Listrik Bulan Ini', 200000, 'out');
                html += buatListHtml('PGL-03', 'Plastik Packing', 20000, 'out');
            }

            container.innerHTML = html;
        }

        function buatListHtml(id, desc, amount, type) {
            const isOut = type === 'out';
            const colorClass = isOut ? 'out' : '';
            const sign = isOut ? '-' : '+';
            const date = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });

            return `
                <div class="trans-item ${colorClass}">
                    <div class="trans-info">
                        <h4>${desc}</h4>
                        <p>${id} • ${date}</p>
                    </div>
                    <div class="trans-amount ${colorClass}">${sign}Rp ${new Intl.NumberFormat('id-ID').format(amount)}</div>
                </div>
            `;
        }
    </script>
</body>
</html>
