<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spincycle Laundry - Login</title>

    <style>
        :root {
            --dark-blue: #15428F;
            --light-blue: #9BB8EA;
            --text-main: #1f2d3d;
            --text-sub: #6b7280;
            --input-bg: #f4f7fb;
            --danger: #e74c3c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .mobile-screen {
            width: 375px;
            height: 750px;
            border-radius: 30px;
            border: 10px solid #333;
            overflow: hidden;
            background: linear-gradient(180deg, #ffffff 0%, #7db3e8 100%);
            box-shadow: 0 15px 45px rgba(21, 66, 143, 0.18);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .top-area {
            background: white;
            padding: 45px 30px 25px;
            text-align: center;
            border-bottom-left-radius: 35px;
            border-bottom-right-radius: 35px;
        }

        .logo-box {
            width: 105px;
            height: 90px;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .brand-title {
            color: var(--dark-blue);
            font-size: 15px;
            font-weight: 800;
            line-height: 1.4;
            text-transform: uppercase;
        }

        .login-area {
            flex: 1;
            padding: 35px 30px 30px;
        }

        .login-area h1 {
            font-size: 22px;
            color: white;
            margin-bottom: 6px;
            font-weight: 800;
        }

        .login-area p {
            font-size: 12px;
            color: rgba(255,255,255,0.9);
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .input-field {
            width: 100%;
            border: none;
            outline: none;
            border-radius: 10px;
            padding: 17px 20px;
            font-size: 14px;
            color: var(--text-main);
            background: rgba(255,255,255,0.9);
        }

        .input-field:focus {
            background: white;
            box-shadow: 0 0 0 2px rgba(21, 66, 143, 0.15);
        }

        .btn-login {
            width: 100%;
            background: #244b8f;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 17px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .login-options {
            margin-top: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: white;
        }

        .remember-box {
            display: flex;
            align-items: center;
            gap: 7px;
            font-weight: 600;
        }

        .forgot-link {
            color: white;
            text-decoration: none;
            font-weight: 500;
        }

        .error-message {
            display: none;
            background: rgba(255, 255, 255, 0.95);
            color: var(--danger);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 14px;
            font-weight: 600;
        }

        .debug-note {
            display: none;
            margin-top: 12px;
            font-size: 10px;
            color: rgba(255,255,255,0.85);
            word-break: break-word;
            line-height: 1.4;
        }
    </style>
</head>

<body>
    <div class="mobile-screen">
        <div class="top-area">
            <div class="logo-box">
                <img src="assets/logo.png" alt="Spincycle Laundry" onerror="this.style.display='none'">
            </div>

            <div class="brand-title">
                WELCOME TO,<br>
                SPINCYCLE LAUNDRY
            </div>
        </div>

        <div class="login-area">
            <h1>Langsung Login kan</h1>
            <p>Lengkapi data dirimu dulu ya</p>

            <div class="error-message" id="error-message"></div>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <input
                        type="text"
                        id="username"
                        class="input-field"
                        placeholder="Username"
                        autocomplete="username"
                        minlength="3"
                        maxlength="30"
                        required
                    >
                </div>

                <div class="form-group">
                    <input
                        type="password"
                        id="password"
                        class="input-field"
                        placeholder="Password"
                        autocomplete="current-password"
                        minlength="6"
                        maxlength="72"
                        required
                    >
                </div>

                <button type="submit" class="btn-login" id="btn-login">
                    Masuk
                </button>

                <div class="login-options">
                    <label class="remember-box">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember Me</span>
                    </label>

                    <a href="#" class="forgot-link" onclick="alert('Silakan hubungi Admin untuk reset password.'); return false;">
                        Lupa Password?
                    </a>
                </div>
            </form>

            <div class="debug-note" id="debug-note"></div>
        </div>
    </div>

    <script>
        const API_LOGIN_URL = 'https://laundry-backend-api-production.up.railway.app/api/karyawan/login';

        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const rememberMeInput = document.getElementById('rememberMe');
        const btnLogin = document.getElementById('btn-login');
        const errorMessage = document.getElementById('error-message');
        const debugNote = document.getElementById('debug-note');

        window.addEventListener('load', function () {
            const rememberedUsername = localStorage.getItem('remember_username');

            if (rememberedUsername) {
                usernameInput.value = rememberedUsername;
                rememberMeInput.checked = true;
            }
        });

        function showError(message) {
            errorMessage.style.display = 'block';
            errorMessage.textContent = message;
        }

        function hideError() {
            errorMessage.style.display = 'none';
            errorMessage.textContent = '';
        }

        function setLoading(status) {
            btnLogin.disabled = status;
            btnLogin.textContent = status ? 'Memeriksa data...' : 'Masuk';
        }

        function cleanUsername(value) {
            return String(value || '')
                .replace(/[^A-Za-z0-9_]/g, '')
                .trim();
        }

        function getUserFromResponse(result) {
            if (!result || typeof result !== 'object') {
                return null;
            }

            return result.data || result.user || result.karyawan || result.result || result;
        }

        function getRoleFromUser(user) {
            return user.role || user.jabatan || user.hak_akses || user.level || 'Karyawan';
        }

        function getNameFromUser(user, fallbackUsername) {
            return user.nama || user.name || user.fullname || user.username || fallbackUsername;
        }

        usernameInput.addEventListener('input', function () {
            this.value = cleanUsername(this.value);
        });

        loginForm.addEventListener('submit', async function (event) {
            event.preventDefault();
            hideError();

            const username = cleanUsername(usernameInput.value);
            const password = passwordInput.value;

            usernameInput.value = username;

            if (!username || !password) {
                showError('Username dan password wajib diisi.');
                return;
            }

            if (username.length < 3) {
                showError('Username minimal 3 karakter.');
                return;
            }

            if (password.length < 6) {
                showError('Password minimal 6 karakter.');
                return;
            }

            try {
                setLoading(true);

                const response = await fetch(API_LOGIN_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                const text = await response.text();

                let result = {};

                try {
                    result = text ? JSON.parse(text) : {};
                } catch (error) {
                    console.error('Response bukan JSON:', text);

                    showError('Server tidak mengembalikan JSON. Cek backend Railway.');
                    return;
                }

                console.log('LOGIN RESPONSE:', result);

                if (!response.ok) {
                    showError(result.message || result.pesan || result.error || 'Login gagal. Periksa username dan password.');
                    return;
                }

                const user = getUserFromResponse(result);

                if (!user || typeof user !== 'object') {
                    console.error('Data user tidak ditemukan:', result);
                    showError('Response login tidak valid. Data user tidak ditemukan.');
                    return;
                }

                const role = getRoleFromUser(user);
                const nama = getNameFromUser(user, username);

                localStorage.setItem('id_kasir', user.id || '');
                localStorage.setItem('nama_kasir', nama);
                localStorage.setItem('username_kasir', user.username || username);
                localStorage.setItem('role_kasir', role);

                if (rememberMeInput.checked) {
                    localStorage.setItem('remember_username', username);
                } else {
                    localStorage.removeItem('remember_username');
                }

                window.location.href = 'dashboard.html';
            } catch (error) {
                console.error('Error login:', error);

                showError('Gagal terhubung ke server. Pastikan backend Railway aktif dan internet lancar.');
            } finally {
                setLoading(false);
            }
        });
    </script>
</body>
</html>
