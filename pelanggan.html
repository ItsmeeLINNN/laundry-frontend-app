<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Pelanggan - Lather & Linen</title>
    <style>
        /* =========================================
           CSS: LAYOUT & STYLING
        ========================================= */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { display: flex; background-color: #f4f7f6; height: 100vh; }
        
        /* 1. LAYOUT: Sidebar Menu */
        .sidebar { width: 250px; background-color: #2c3e50; color: white; padding: 20px; }
        .sidebar h2 { margin-bottom: 30px; font-size: 20px; text-align: center; border-bottom: 1px solid #34495e; padding-bottom: 10px; }
        .sidebar a { display: block; color: #ecf0f1; text-decoration: none; padding: 10px; margin-bottom: 10px; border-radius: 5px; transition: 0.3s; }
        .sidebar a:hover, .sidebar a.active { background-color: #3498db; }

        /* 2. LAYOUT: Konten Utama */
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .header { margin-bottom: 20px; }
        .header h1 { color: #333; font-size: 24px; }

        /* 3. FORM INPUT */
        .form-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; outline: none; }
        .form-group input:focus { border-color: #3498db; }
        
        /* Tombol */
        .btn { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; color: white; font-weight: bold; transition: 0.3s; }
        .btn-save { background-color: #27ae60; }
        .btn-save:hover { background-color: #219150; }
        .btn-cancel { background-color: #95a5a6; margin-left: 10px; display: none; }
        .btn-edit { background-color: #f39c12; padding: 5px 10px; font-size: 12px; }
        .btn-delete { background-color: #e74c3c; padding: 5px 10px; font-size: 12px; margin-left: 5px; }

        /* 4. TABEL DATA */
        .table-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: #f8f9fa; color: #333; }
        tr:hover { background-color: #f1f2f6; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Lather & Linen</h2>
        <a href="#">🏠 Dashboard</a>
        <a href="#" class="active">👥 Pelanggan</a>
        <a href="#">📦 Layanan</a>
        <a href="#">🛒 Kasir</a>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Manajemen Pelanggan</h1>
        </div>

        <div class="form-card">
            <h3 id="form-title" style="margin-bottom: 15px; color: #3498db;">Tambah Pelanggan Baru</h3>
            <input type="hidden" id="customer_id"> 
            
            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" id="name" placeholder="Masukkan nama pelanggan" required>
            </div>
            <div class="form-group">
                <label>Nomor WhatsApp</label>
                <input type="text" id="phone" placeholder="08xxxxxxxxxx" required>
            </div>
            <div class="form-group">
                <label>Alamat</label>
                <input type="text" id="address" placeholder="Detail alamat" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="email@contoh.com">
            </div>
            <button class="btn btn-save" onclick="simpanData()">💾 Simpan Data</button>
            <button class="btn btn-cancel" id="btn-cancel" onclick="resetForm()">❌ Batal Edit</button>
        </div>

        <div class="table-card">
            <h3>Daftar Pelanggan</h3>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nama</th>
                        <th>WhatsApp</th>
                        <th>Alamat</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="tabel-body">
                    <tr><td colspan="5" style="text-align: center;">Memuat data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        /* =========================================
           JAVASCRIPT: MENGHUBUNGKAN KE API BACKEND
        ========================================= */
        const apiUrl = 'http://localhost:3000/api/pelanggan';

        // 1. READ: Menampilkan data ke Tabel
        async function muatData() {
            try {
                const response = await fetch(apiUrl);
                const result = await response.json();
                const tbody = document.getElementById('tabel-body');
                tbody.innerHTML = ''; // Kosongkan tabel dulu

                if (result.data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Belum ada data pelanggan</td></tr>';
                    return;
                }

                result.data.forEach(pelanggan => {
                    // Stringify data agar bisa dikirim ke fungsi edit
                    const dataJson = JSON.stringify(pelanggan).replace(/"/g, '&quot;');
                    
                    const row = `<tr>
                        <td>${pelanggan.customer_id}</td>
                        <td><strong>${pelanggan.name}</strong></td>
                        <td>${pelanggan.phone}</td>
                        <td>${pelanggan.address}</td>
                        <td>
                            <button class="btn btn-edit" onclick="siapkanEdit('${dataJson}')">✏️ Edit</button>
                            <button class="btn btn-delete" onclick="hapusData(${pelanggan.customer_id})">🗑️ Hapus</button>
                        </td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
            } catch (error) {
                console.error("Gagal memuat:", error);
            }
        }

        // 2. CREATE & UPDATE: Menyimpan data dari Form
        async function simpanData() {
            const id = document.getElementById('customer_id').value;
            const data = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value,
                email: document.getElementById('email').value
            };

            // Validasi sederhana
            if(!data.name || !data.phone) return alert("Nama dan WhatsApp wajib diisi!");

            try {
                let url = apiUrl;
                let method = 'POST'; // Default adalah Tambah Baru (Create)

                // Jika ID ada isinya, berarti mode Edit (Update)
                if (id) {
                    url = `${apiUrl}/${id}`;
                    method = 'PUT';
                }

                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                if (result.status === 'SUKSES') {
                    alert(result.pesan);
                    resetForm();
                    muatData(); // Refresh tabel otomatis
                }
            } catch (error) {
                alert("Terjadi kesalahan sistem!");
            }
        }

        // 3. DELETE: Menghapus data
        async function hapusData(id) {
            if (confirm("Apakah kamu yakin ingin menghapus pelanggan ini?")) {
                try {
                    const response = await fetch(`${apiUrl}/${id}`, { method: 'DELETE' });
                    const result = await response.json();
                    if (result.status === 'SUKSES') {
                        muatData(); // Refresh tabel
                    }
                } catch (error) {
                    alert("Gagal menghapus data.");
                }
            }
        }

        // --- Fungsi Pendukung UI ---
        function siapkanEdit(pelangganString) {
            const pelanggan = JSON.parse(pelangganString);
            document.getElementById('customer_id').value = pelanggan.customer_id;
            document.getElementById('name').value = pelanggan.name;
            document.getElementById('phone').value = pelanggan.phone;
            document.getElementById('address').value = pelanggan.address;
            document.getElementById('email').value = pelanggan.email;

            document.getElementById('form-title').innerText = "Edit Data Pelanggan";
            document.getElementById('form-title').style.color = "#f39c12";
            document.getElementById('btn-cancel').style.display = "inline-block";
        }

        function resetForm() {
            document.getElementById('customer_id').value = '';
            document.getElementById('name').value = '';
            document.getElementById('phone').value = '';
            document.getElementById('address').value = '';
            document.getElementById('email').value = '';
            
            document.getElementById('form-title').innerText = "Tambah Pelanggan Baru";
            document.getElementById('form-title').style.color = "#3498db";
            document.getElementById('btn-cancel').style.display = "none";
        }

        // Panggil fungsi muatData() saat halaman pertama kali dibuka
        window.onload = muatData;
    </script>
</body>
</html>
